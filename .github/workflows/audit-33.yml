name: Final 33 Lesson Audit

on:
  push:
    branches: [chatgpt/final-33-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final audit fixes
        run: node authoring/apply-final-audit-fixes.mjs
      - name: Final 33-lesson audit
        run: node authoring/audit-all-lessons.mjs
      - name: Validate content
        run: npm run validate:content
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/lessons content/assets reference-library
          git commit -m "fix: close final operational competency gaps"
          git push origin HEAD:chatgpt/final-33-audit
