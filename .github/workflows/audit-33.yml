name: Final 33 Lesson Audit

on:
  push:
    branches: [chatgpt/final-33-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Final 33-lesson audit
        run: node authoring/audit-all-lessons.mjs
      - name: Validate content
        run: npm run validate:content
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
