<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A320neo V2 cold and dark preparation reference"><rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="65" y="75" fill="#eaf5ff" font-size="40" font-weight="700">A320neo V2 · Cold &amp; Dark → Before Start</text><text x="65" y="115" fill="#9dc2db" font-size="23">Microsoft / iniBuilds · recreación educativa basada en Manual + QRC oficial</text><rect x="70" y="165" width="310" height="560" rx="22" fill="#102b3e"/><text x="105" y="220" fill="#63d7ff" font-size="28" font-weight="700">1 · ENERGÍA</text><text x="105" y="280" fill="white" font-size="23">BAT 1 / BAT 2</text><text x="105" y="325" fill="white" font-size="23">EXT PWR o APU</text><text x="105" y="370" fill="#c7e3f5" font-size="21">Confirma estado antes</text><text x="105" y="400" fill="#c7e3f5" font-size="21">de seguir.</text><rect x="420" y="165" width="310" height="560" rx="22" fill="#102b3e"/><text x="455" y="220" fill="#63d7ff" font-size="28" font-weight="700">2 · PREPARA</text><text x="455" y="280" fill="white" font-size="23">ADIRS → NAV</text><text x="455" y="325" fill="white" font-size="23">Fuel quantity CHECK</text><text x="455" y="370" fill="white" font-size="23">Baro ref SET</text><text x="455" y="415" fill="white" font-size="23">Doors/windows CLOSED</text><rect x="770" y="165" width="350" height="560" rx="22" fill="#102b3e"/><text x="805" y="220" fill="#63d7ff" font-size="28" font-weight="700">3 · MCDU / PERF</text><text x="805" y="280" fill="white" font-size="23">INIT / F-PLN / PERF</text><text x="805" y="325" fill="#ffe890" font-size="23">T/O data SET</text><text x="805" y="370" fill="#ffe890" font-size="23">V1 · VR · V2</text><text x="805" y="415" fill="#c7e3f5" font-size="21">Valores calculados para</text><text x="805" y="445" fill="#c7e3f5" font-size="21">el escenario; nunca universales.</text><rect x="1160" y="165" width="370" height="560" rx="22" fill="#102b3e"/><text x="1195" y="220" fill="#63d7ff" font-size="28" font-weight="700">4 · BEFORE START</text><text x="1195" y="280" fill="white" font-size="23">Signs ON/AUTO</text><text x="1195" y="325" fill="white" font-size="23">Beacon ON</text><text x="1195" y="370" fill="white" font-size="23">Thrust levers IDLE</text><text x="1195" y="415" fill="white" font-size="23">Parking brake AS REQ</text><text x="1195" y="460" fill="white" font-size="23">Transponder AS REQ</text><path d="M380 445 H420 M730 445 H770 M1120 445 H1160" stroke="#4fd9ff" stroke-width="10"/><text x="160" y="800" fill="#9dc2db" font-size="23">Regla: control → acción → indicación esperada. Si la variante no coincide con esta referencia, vuelve al manual A320neo V2 antes de continuar.</text></g></svg>