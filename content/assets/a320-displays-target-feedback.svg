<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo conceptual de selección y supervisión</title>
  <desc id="desc">Un objetivo se selecciona, se confirma en una anunciación o modo, se compara con la respuesta observada y conduce a continuar o detenerse para verificar.</desc>
  <rect width="1200" height="560" fill="#07141d"/>
  <text x="600" y="65" text-anchor="middle" fill="#eef7fb" font-family="Arial, sans-serif" font-size="32" font-weight="700">SELECCIONAR NO ES TERMINAR: HAY QUE COMPROBAR</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(65 185)"><circle cx="115" cy="115" r="104" fill="#192f42" stroke="#ca8cff" stroke-width="5"/><text x="115" y="100" fill="#d9adff" font-size="28" font-weight="700">1</text><text x="115" y="137" fill="#eef7fb" font-size="23">Seleccionar</text><text x="115" y="168" fill="#b9d7e2" font-size="18">un objetivo</text></g>
    <g transform="translate(345 185)"><circle cx="115" cy="115" r="104" fill="#192f42" stroke="#55d6ad" stroke-width="5"/><text x="115" y="100" fill="#69e7bc" font-size="28" font-weight="700">2</text><text x="115" y="137" fill="#eef7fb" font-size="23">Confirmar</text><text x="115" y="168" fill="#b9d7e2" font-size="18">modo mostrado</text></g>
    <g transform="translate(625 185)"><circle cx="115" cy="115" r="104" fill="#192f42" stroke="#53c5e8" stroke-width="5"/><text x="115" y="100" fill="#67d6f5" font-size="28" font-weight="700">3</text><text x="115" y="137" fill="#eef7fb" font-size="23">Observar</text><text x="115" y="168" fill="#b9d7e2" font-size="18">la respuesta</text></g>
    <g transform="translate(905 185)"><circle cx="115" cy="115" r="104" fill="#192f42" stroke="#ffbc57" stroke-width="5"/><text x="115" y="100" fill="#ffd080" font-size="28" font-weight="700">4</text><text x="115" y="137" fill="#eef7fb" font-size="23">Comparar</text><text x="115" y="168" fill="#b9d7e2" font-size="18">intención y resultado</text></g>
  </g>
  <path d="M290 300H335M570 300H615M850 300H895" stroke="#d8eff7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1025 440C800 525 400 525 175 440" stroke="#f5c16a" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <text x="600" y="500" text-anchor="middle" fill="#ffd080" font-family="Arial, sans-serif" font-size="23">Si no coinciden: detén la práctica, estabiliza y verifica la variante.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d8eff7"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f5c16a"/></marker></defs>
</svg>
