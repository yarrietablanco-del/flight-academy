<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A320neo V2 landing taxi gate shutdown reference"><rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="65" y="75" fill="#eaf5ff" font-size="40" font-weight="700">A320neo V2 · Landing → Gate → Shutdown</text><text x="65" y="115" fill="#9dc2db" font-size="23">El vuelo termina cuando el avión queda estacionado y asegurado, no al tocar pista</text><rect x="65" y="170" width="280" height="545" rx="22" fill="#102b3e"/><text x="100" y="225" fill="#63d7ff" font-size="28" font-weight="700">1 · LANDING</text><text x="100" y="285" fill="white" font-size="22">Gear DOWN</text><text x="100" y="325" fill="white" font-size="22">Spoilers ARM</text><text x="100" y="365" fill="white" font-size="22">Flaps SET</text><text x="100" y="405" fill="white" font-size="22">LDG NO BLUE</text><rect x="375" y="170" width="280" height="545" rx="22" fill="#102b3e"/><text x="410" y="225" fill="#63d7ff" font-size="28" font-weight="700">2 · AFTER LDG</text><text x="410" y="285" fill="white" font-size="22">Flaps RETRACT</text><text x="410" y="325" fill="white" font-size="22">Spoilers DISARM</text><text x="410" y="365" fill="white" font-size="22">APU START</text><text x="410" y="405" fill="white" font-size="22">Radar / PWS OFF</text><rect x="685" y="170" width="280" height="545" rx="22" fill="#102b3e"/><text x="720" y="225" fill="#63d7ff" font-size="28" font-weight="700">3 · TAXI GATE</text><text x="720" y="285" fill="white" font-size="22">Diagram OPEN</text><text x="720" y="325" fill="white" font-size="22">Route verified</text><text x="720" y="365" fill="#ffe890" font-size="22">HS reviewed</text><text x="720" y="405" fill="#ffaaa4" font-size="22">Runway crossings CHECK</text><rect x="995" y="170" width="280" height="545" rx="22" fill="#102b3e"/><text x="1030" y="225" fill="#63d7ff" font-size="28" font-weight="700">4 · PARKING</text><text x="1030" y="285" fill="white" font-size="22">APU BLEED ON</text><text x="1030" y="325" fill="white" font-size="22">Engines OFF</text><text x="1030" y="365" fill="white" font-size="22">Fuel pumps OFF</text><text x="1030" y="405" fill="white" font-size="22">Park brake / chocks</text><rect x="1305" y="170" width="230" height="545" rx="22" fill="#102b3e"/><text x="1335" y="225" fill="#63d7ff" font-size="27" font-weight="700">5 · SECURE</text><text x="1335" y="285" fill="white" font-size="21">ADIRS OFF</text><text x="1335" y="325" fill="white" font-size="21">Oxygen OFF</text><text x="1335" y="365" fill="white" font-size="21">APU OFF</text><text x="1335" y="405" fill="white" font-size="21">BAT OFF</text><path d="M345 440 H375 M655 440 H685 M965 440 H995 M1275 440 H1305" stroke="#4fd9ff" stroke-width="10"/><text x="160" y="800" fill="#9dc2db" font-size="23">Cierre completo: aterriza → libera pista → navega por el airport diagram → estaciona → asegura sistemas según el QRC de la variante.</text></g></svg>