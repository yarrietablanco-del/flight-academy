<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de una entrada verificada y una entrada no verificada</title>
  <desc id="desc">Diagrama conceptual de dos rutas: una conserva el origen del dato y permite comparar el resultado; la otra carece de fuente y obliga a detener la práctica.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59d7c6"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef7d78"/></marker></defs>
  <rect width="1200" height="560" fill="#10212d"/>
  <text x="600" y="55" text-anchor="middle" fill="#f6fbff" font-family="Arial, sans-serif" font-size="30" font-weight="700">La comprobación decide si continúas</text>
  <text x="600" y="88" text-anchor="middle" fill="#b9cad5" font-family="Arial, sans-serif" font-size="18">Comparación conceptual; no son campos ni resultados de una página MCDU real.</text>
  <g font-family="Arial, sans-serif">
    <text x="70" y="150" fill="#59d7c6" font-size="22" font-weight="700">DATO CON FUENTE</text>
    <rect x="70" y="175" width="225" height="92" rx="14" fill="#17394a" stroke="#59d7c6" stroke-width="3"/><text x="182" y="214" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">Origen identificado</text><text x="182" y="242" text-anchor="middle" fill="#d9e6ed" font-size="16">escenario + variante</text>
    <rect x="435" y="175" width="225" height="92" rx="14" fill="#17394a" stroke="#59d7c6" stroke-width="3"/><text x="547" y="214" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">Entrada limitada</text><text x="547" y="242" text-anchor="middle" fill="#d9e6ed" font-size="16">un dato a la vez</text>
    <rect x="800" y="175" width="330" height="92" rx="14" fill="#1b4f50" stroke="#59d7c6" stroke-width="3"/><text x="965" y="214" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">Resultado comparable</text><text x="965" y="242" text-anchor="middle" fill="#d9e6ed" font-size="16">coherente → documentar y continuar</text>
    <path d="M295 221 H425 M660 221 H790" fill="none" stroke="#59d7c6" stroke-width="5" marker-end="url(#a)"/>
    <text x="70" y="360" fill="#ef7d78" font-size="22" font-weight="700">DATO SIN FUENTE</text>
    <rect x="70" y="385" width="225" height="92" rx="14" fill="#442e38" stroke="#ef7d78" stroke-width="3"/><text x="182" y="424" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">No verificable</text><text x="182" y="452" text-anchor="middle" fill="#f0d9dc" font-size="16">no sabes de dónde sale</text>
    <rect x="435" y="385" width="225" height="92" rx="14" fill="#442e38" stroke="#ef7d78" stroke-width="3"/><text x="547" y="424" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">No ingresar</text><text x="547" y="452" text-anchor="middle" fill="#f0d9dc" font-size="16">no adivines ni copies</text>
    <rect x="800" y="385" width="330" height="92" rx="14" fill="#5a3036" stroke="#ef7d78" stroke-width="3"/><text x="965" y="424" text-anchor="middle" fill="#f6fbff" font-size="20" font-weight="700">Detener y verificar</text><text x="965" y="452" text-anchor="middle" fill="#f0d9dc" font-size="16">corrige antes de continuar</text>
    <path d="M295 431 H425 M660 431 H790" fill="none" stroke="#ef7d78" stroke-width="5" marker-end="url(#b)"/>
  </g>
</svg>
