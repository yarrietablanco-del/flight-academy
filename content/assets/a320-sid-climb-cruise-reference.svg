<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A320neo V2 SID climb cruise supervision reference"><rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="65" y="75" fill="#eaf5ff" font-size="40" font-weight="700">A320neo V2 · SID → Climb → Cruise</text><text x="65" y="115" fill="#9dc2db" font-size="23">Carta → MCDU/F-PLN → ND → FCU/PFD → supervisión</text><rect x="70" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="105" y="230" fill="#63d7ff" font-size="28" font-weight="700">1 · CARTA</text><text x="105" y="290" fill="white" font-size="23">SID correcta</text><text x="105" y="335" fill="white" font-size="23">Pista / transición</text><text x="105" y="380" fill="white" font-size="23">Fixes / restricciones</text><rect x="390" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="425" y="230" fill="#63d7ff" font-size="28" font-weight="700">2 · MCDU</text><text x="425" y="290" fill="white" font-size="23">INIT A/B</text><text x="425" y="335" fill="white" font-size="23">F-PLN</text><text x="425" y="380" fill="white" font-size="23">RWY / SID active</text><rect x="710" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="745" y="230" fill="#63d7ff" font-size="28" font-weight="700">3 · ND</text><text x="745" y="290" fill="white" font-size="23">Ruta visible</text><text x="745" y="335" fill="white" font-size="23">Siguiente fix</text><text x="745" y="380" fill="#ffe890" font-size="23">¿Coincide con carta?</text><rect x="1030" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="1065" y="230" fill="#63d7ff" font-size="28" font-weight="700">4 · FCU / PFD</text><text x="1065" y="290" fill="white" font-size="23">Objetivos</text><text x="1065" y="335" fill="white" font-size="23">FMA / modos</text><text x="1065" y="380" fill="#ffe890" font-size="23">Supervisa resultado</text><rect x="1350" y="175" width="190" height="520" rx="22" fill="#102b3e"/><text x="1380" y="230" fill="#63d7ff" font-size="27" font-weight="700">5 · CRUISE</text><text x="1380" y="290" fill="white" font-size="21">Ruta</text><text x="1380" y="330" fill="white" font-size="21">Altitud</text><text x="1380" y="370" fill="white" font-size="21">Combustible</text><text x="1380" y="410" fill="white" font-size="21">Sistemas</text><path d="M350 435 H390 M670 435 H710 M990 435 H1030 M1310 435 H1350" stroke="#4fd9ff" stroke-width="10"/><text x="150" y="790" fill="#9dc2db" font-size="23">Automatización no sustituye supervisión: el alumno compara carta, F-PLN, ND y FMA/PFD y corrige solo después de identificar una discrepancia.</text></g></svg>