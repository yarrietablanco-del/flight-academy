<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A320neo V2 STAR and approach preparation reference"><rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="65" y="75" fill="#eaf5ff" font-size="40" font-weight="700">A320neo V2 · Descent → STAR → Approach</text><text x="65" y="115" fill="#9dc2db" font-size="23">Reutiliza competencias de cartas: interpreta primero, carga después, supervisa siempre</text><rect x="70" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="105" y="230" fill="#63d7ff" font-size="28" font-weight="700">1 · STAR</text><text x="105" y="290" fill="white" font-size="23">Transición</text><text x="105" y="335" fill="white" font-size="23">Fixes</text><text x="105" y="380" fill="white" font-size="23">Restricciones</text><rect x="390" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="425" y="230" fill="#63d7ff" font-size="28" font-weight="700">2 · APPROACH</text><text x="425" y="290" fill="white" font-size="23">Carta correcta</text><text x="425" y="335" fill="white" font-size="23">Course / minima</text><text x="425" y="380" fill="white" font-size="23">Missed approach</text><rect x="710" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="745" y="230" fill="#63d7ff" font-size="28" font-weight="700">3 · MCDU / ND</text><text x="745" y="290" fill="white" font-size="23">F-PLN revisado</text><text x="745" y="335" fill="white" font-size="23">Ruta visible</text><text x="745" y="380" fill="#ffe890" font-size="23">Sin discontinuidad</text><rect x="1030" y="175" width="280" height="520" rx="22" fill="#102b3e"/><text x="1065" y="230" fill="#63d7ff" font-size="28" font-weight="700">4 · BRIEFING</text><text x="1065" y="290" fill="white" font-size="23">ECAM status</text><text x="1065" y="335" fill="white" font-size="23">MDA / DH SET</text><text x="1065" y="380" fill="white" font-size="23">Baro ref SET</text><rect x="1350" y="175" width="190" height="520" rx="22" fill="#102b3e"/><text x="1380" y="230" fill="#63d7ff" font-size="27" font-weight="700">5 · MONITOR</text><text x="1380" y="290" fill="white" font-size="21">ND</text><text x="1380" y="330" fill="white" font-size="21">PFD</text><text x="1380" y="370" fill="white" font-size="21">FMA</text><text x="1380" y="410" fill="white" font-size="21">ECAM</text><path d="M350 435 H390 M670 435 H710 M990 435 H1030 M1310 435 H1350" stroke="#4fd9ff" stroke-width="10"/><text x="180" y="790" fill="#9dc2db" font-size="23">No copies datos entre cartas. La aproximación cargada, la carta, el ND y los mínimos deben describir el mismo procedimiento.</text></g></svg>