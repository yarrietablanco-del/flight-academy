<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="A320neo V2 pushback engine start and taxi reference"><rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="65" y="75" fill="#eaf5ff" font-size="40" font-weight="700">A320neo V2 · Pushback → Start → Taxi</text><text x="65" y="115" fill="#9dc2db" font-size="23">Secuencia educativa: confirma cada estado antes de avanzar</text><rect x="75" y="175" width="330" height="530" rx="22" fill="#102b3e"/><text x="110" y="230" fill="#63d7ff" font-size="29" font-weight="700">1 · PUSHBACK</text><text x="110" y="290" fill="white" font-size="23">Before Start COMPLETE</text><text x="110" y="335" fill="white" font-size="23">Beacon ON</text><text x="110" y="380" fill="white" font-size="23">Parking brake AS REQ</text><text x="110" y="425" fill="#c7e3f5" font-size="21">Mantén coordinación con</text><text x="110" y="455" fill="#c7e3f5" font-size="21">pushback / ATC de MSFS.</text><rect x="445" y="175" width="330" height="530" rx="22" fill="#102b3e"/><text x="480" y="230" fill="#63d7ff" font-size="29" font-weight="700">2 · ENGINE START</text><text x="480" y="290" fill="white" font-size="23">APU / bleed disponible</text><text x="480" y="335" fill="white" font-size="23">ENG MODE → IGN/START</text><text x="480" y="380" fill="white" font-size="23">ENG MASTER → ON</text><text x="480" y="425" fill="#ffe890" font-size="22">Verifica AVAIL / EWD</text><text x="480" y="460" fill="#c7e3f5" font-size="20">antes del siguiente motor.</text><rect x="815" y="175" width="330" height="530" rx="22" fill="#102b3e"/><text x="850" y="230" fill="#63d7ff" font-size="29" font-weight="700">3 · AFTER START</text><text x="850" y="290" fill="white" font-size="23">ECAM status CHECK</text><text x="850" y="335" fill="white" font-size="23">Pitch trim SET</text><text x="850" y="380" fill="white" font-size="23">Rudder trim ZERO</text><text x="850" y="425" fill="white" font-size="23">Ground equipment CLEAR</text><rect x="1185" y="175" width="340" height="530" rx="22" fill="#102b3e"/><text x="1220" y="230" fill="#63d7ff" font-size="29" font-weight="700">4 · TAXI</text><text x="1220" y="290" fill="white" font-size="23">Airport diagram OPEN</text><text x="1220" y="335" fill="white" font-size="23">Route / HS reviewed</text><text x="1220" y="380" fill="white" font-size="23">Flight controls CHECK</text><text x="1220" y="425" fill="#ffaaa4" font-size="23">Hold short = STOP</text><path d="M405 440 H445 M775 440 H815 M1145 440 H1185" stroke="#4fd9ff" stroke-width="10"/><text x="180" y="795" fill="#9dc2db" font-size="23">No avances por memoria: mira la indicación esperada en ECAM/EWD y reutiliza el método de taxi aprendido con diagramas aeroportuarios.</text></g></svg>