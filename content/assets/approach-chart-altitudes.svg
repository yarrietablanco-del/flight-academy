<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Relación de altitudes en un perfil conceptual</title><desc id="desc">Un perfil conceptual muestra restricciones verticales que descienden hacia el final, sin valores ni puntos procedimentales reales.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 10 5.5 1 10Z" fill="#38bdf8"/><style>.b{fill:#071426}.p{fill:#10233d;stroke:#315273;stroke-width:2}.l{font-family:Arial,sans-serif;fill:#f8fafc}.s{font-family:Arial,sans-serif;fill:#cbd5e1}.r{fill:none;stroke:#38bdf8;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.d{stroke:#fbbf24;stroke-width:3;stroke-dasharray:10 9}.n{fill:#fbbf24;stroke:#fde68a;stroke-width:3}</style></defs>
  <rect class="b" width="1200" height="560" rx="28"/><text class="l" x="600" y="63" text-anchor="middle" font-size="30" font-weight="bold">Altitudes: relación en perfil</text><text class="s" x="600" y="95" text-anchor="middle" font-size="18">Esquema conceptual; no representa mínimos, pendientes ni altitudes publicadas.</text><rect class="p" x="80" y="145" width="1040" height="290" rx="20"/>
  <path d="M130 385 H1060" stroke="#94a3b8" stroke-width="5"/><path class="r" d="M200 220 L500 285 L780 350 L970 385"/><line class="d" x1="200" y1="220" x2="200" y2="385"/><line class="d" x1="500" y1="285" x2="500" y2="385"/><line class="d" x1="780" y1="350" x2="780" y2="385"/><circle class="n" cx="200" cy="220" r="12"/><circle class="n" cx="500" cy="285" r="12"/><circle class="n" cx="780" cy="350" r="12"/><text class="l" x="200" y="190" text-anchor="middle" font-size="19" font-weight="bold">Restricción 1</text><text class="l" x="500" y="255" text-anchor="middle" font-size="19" font-weight="bold">Restricción 2</text><text class="l" x="780" y="320" text-anchor="middle" font-size="19" font-weight="bold">Restricción 3</text><text class="l" x="970" y="420" text-anchor="middle" font-size="19" font-weight="bold">Final</text><text class="s" x="600" y="500" text-anchor="middle" font-size="18">Lee cada restricción junto al punto y su símbolo: una cifra aislada no define cómo aplicarla.</text>
</svg>
