<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Curso final en una vista de planta conceptual</title><desc id="desc">Un recorrido de aproximación conceptual muestra un punto de entrada, una línea de curso final y el umbral, sin reproducir una carta ni datos publicados.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 10 5.5 1 10Z" fill="#38bdf8"/></marker><style>.b{fill:#071426}.p{fill:#10233d;stroke:#315273;stroke-width:2}.l{font-family:Arial,sans-serif;fill:#f8fafc}.s{font-family:Arial,sans-serif;fill:#cbd5e1}.r{fill:none;stroke:#38bdf8;stroke-width:8;stroke-linecap:round;marker-end:url(#a)}.n{fill:#fbbf24;stroke:#fde68a;stroke-width:3}</style></defs>
  <rect class="b" width="1200" height="560" rx="28"/><text class="l" x="600" y="63" text-anchor="middle" font-size="30" font-weight="bold">Curso final: relación en vista de planta</text><text class="s" x="600" y="95" text-anchor="middle" font-size="18">Esquema conceptual; el curso y los puntos reales se leen únicamente en la carta vigente.</text>
  <rect class="p" x="80" y="145" width="1040" height="290" rx="20"/><circle class="n" cx="235" cy="290" r="15"/><text class="l" x="235" y="338" text-anchor="middle" font-size="20" font-weight="bold">Punto de entrada</text><path class="r" d="M265 290 H900"/><path d="M900 215v150" stroke="#e2e8f0" stroke-width="17"/><path d="M860 290h80" stroke="#fbbf24" stroke-width="5"/><text class="l" x="582" y="262" text-anchor="middle" font-size="24" font-weight="bold">Curso final publicado</text><text class="s" x="582" y="323" text-anchor="middle" font-size="18">Sigue la línea hacia el umbral</text><text class="l" x="900" y="400" text-anchor="middle" font-size="20" font-weight="bold">Umbral</text><text class="s" x="600" y="500" text-anchor="middle" font-size="18">Primero identifica la línea que conduce al final; después compara el curso escrito con la carta aplicable.</text>
</svg>
