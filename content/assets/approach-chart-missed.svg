<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">La aproximación frustrada como ruta publicada separada</title><desc id="desc">La trayectoria conceptual llega al final y se desvía hacia una ruta de frustrada ascendente, sin instrucciones, altitudes ni rumbos reales.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 10 5.5 1 10Z" fill="#38bdf8"/><marker id="m" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 10 5.5 1 10Z" fill="#fb7185"/><style>.b{fill:#071426}.p{fill:#10233d;stroke:#315273;stroke-width:2}.l{font-family:Arial,sans-serif;fill:#f8fafc}.s{font-family:Arial,sans-serif;fill:#cbd5e1}.r{fill:none;stroke:#38bdf8;stroke-width:8;stroke-linecap:round;marker-end:url(#a)}.m{fill:none;stroke:#fb7185;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#m)}.n{fill:#fbbf24;stroke:#fde68a;stroke-width:3}</style></defs>
  <rect class="b" width="1200" height="560" rx="28"/><text class="l" x="600" y="63" text-anchor="middle" font-size="30" font-weight="bold">Frustrada: una continuación publicada</text><text class="s" x="600" y="95" text-anchor="middle" font-size="18">Esquema conceptual; la secuencia real debe leerse completa en la carta aplicable.</text><rect class="p" x="80" y="145" width="1040" height="290" rx="20"/>
  <path class="r" d="M185 330 H570"/><circle class="n" cx="580" cy="330" r="16"/><text class="l" x="360" y="295" text-anchor="middle" font-size="23" font-weight="bold">Aproximación hacia el final</text><text class="l" x="580" y="372" text-anchor="middle" font-size="18" font-weight="bold">Punto de decisión publicado</text><path class="m" d="M598 318 C700 250 740 215 850 215 H1010"/><text x="835" y="182" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="bold" fill="#fda4af">Ruta de frustrada</text><text class="s" x="835" y="250" text-anchor="middle" font-size="18">dirección y ascenso según la carta</text><text class="s" x="600" y="500" text-anchor="middle" font-size="18">No improvises la ruta: identifica su texto y su trazo antes de iniciar la práctica de simulación.</text>
</svg>
