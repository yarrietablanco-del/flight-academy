<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Relación entre actitud, potencia y trayectoria</title>
  <desc id="desc">Diagrama conceptual con tres estados: ascenso, nivelado y descenso. En cada estado se distinguen actitud, potencia y tendencia de altitud.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-weight:700}.s{font-size:24px}.m{font-size:20px}.l{stroke:#667085;stroke-width:3}.p{stroke:#1976d2;stroke-width:8;fill:none;stroke-linecap:round}.a{stroke:#ef6c00;stroke-width:8;fill:none;stroke-linecap:round}.g{stroke:#c7d1df;stroke-width:2}</style></defs>
  <rect width="1200" height="675" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" class="h s">Actitud + potencia crean una tendencia; los instrumentos la confirman</text>
  <line x1="400" y1="110" x2="400" y2="605" class="g"/><line x1="800" y1="110" x2="800" y2="605" class="g"/>
  <g transform="translate(0 0)"><text x="200" y="125" text-anchor="middle" class="h s">ASCENSO</text><path d="M72 390H330" class="l"/><path d="M100 395 L276 280" class="p"/><path d="M160 355 l35 -10 l-20 30 z" fill="#1976d2"/><text x="200" y="445" text-anchor="middle" class="m">Actitud: morro arriba</text><text x="200" y="480" text-anchor="middle" class="m">Potencia: añade según responda</text><path d="M200 530 v-48" class="a"/><path d="M185 496 l15 -22 l15 22" fill="#ef6c00"/><text x="200" y="570" text-anchor="middle" class="h m">Altitud con tendencia a subir</text></g>
  <g transform="translate(400 0)"><text x="200" y="125" text-anchor="middle" class="h s">NIVELADO</text><path d="M72 335H330" class="l"/><path d="M100 335 H280" class="p"/><path d="M170 321 l35 14 l-35 14 z" fill="#1976d2"/><text x="200" y="445" text-anchor="middle" class="m">Actitud: morro estable</text><text x="200" y="480" text-anchor="middle" class="m">Potencia: ajusta a la situación</text><path d="M160 520 H240" class="a"/><text x="200" y="570" text-anchor="middle" class="h m">Altitud sin tendencia sostenida</text></g>
  <g transform="translate(800 0)"><text x="200" y="125" text-anchor="middle" class="h s">DESCENSO</text><path d="M72 280H330" class="l"/><path d="M100 285 L276 400" class="p"/><path d="M205 365 l35 10 l-20 -30 z" fill="#1976d2"/><text x="200" y="445" text-anchor="middle" class="m">Actitud: morro abajo</text><text x="200" y="480" text-anchor="middle" class="m">Potencia: reduce según responda</text><path d="M200 482 v48" class="a"/><path d="M185 516 l15 22 l15 -22" fill="#ef6c00"/><text x="200" y="570" text-anchor="middle" class="h m">Altitud con tendencia a bajar</text></g>
  <text x="600" y="635" text-anchor="middle" class="m">Azul: trayectoria observada. Naranja: dirección del cambio de potencia. No representa ángulos ni ajustes universales.</text>
</svg>
