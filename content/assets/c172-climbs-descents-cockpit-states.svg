<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Vista de cabina C172: ascenso, nivelado y descenso</title><desc id="desc">Tres vistas reconocibles desde el asiento del piloto del C172. El horizonte se desplaza respecto al parabrisas y panel para representar ascenso, vuelo nivelado y descenso.</desc><style>.h{font:700 31px Arial;fill:#17364a}.l{font:700 23px Arial;fill:#17364a}.w{font:21px Arial;fill:#fff}</style><rect width="1600" height="900" fill="#f5f8fa"/><text x="800" y="55" text-anchor="middle" class="h">VISTA DESDE CABINA · RELACIÓN ENTRE HORIZONTE Y PANEL</text><text x="800" y="88" text-anchor="middle" font-family="Arial" font-size="20" fill="#466174">Es una referencia de reconocimiento: no copies una posición fija del morro.</text><g transform="translate(50 145)"><text x="235" y="-20" text-anchor="middle" class="h">ASCENSO</text><rect width="470" height="550" rx="22" fill="#17242c"/><path d="M35 45H435L395 355H75Z" fill="#62b7df"/><path d="M68 275H402L390 355H80Z" fill="#668346"/><path d="M25 355H445L470 550H0Z" fill="#26343c"/><path d="M60 260H410" stroke="#f7c948" stroke-width="7"/><text x="235" y="246" text-anchor="middle" class="w">HORIZONTE MÁS BAJO</text><path d="M235 355V520M130 445H340" stroke="#aebfc8" stroke-width="7"/><text x="235" y="590" text-anchor="middle" class="l">Morro por encima del horizonte</text></g><g transform="translate(565 145)"><text x="235" y="-20" text-anchor="middle" class="h">NIVELADO</text><rect width="470" height="550" rx="22" fill="#17242c"/><path d="M35 45H435L395 355H75Z" fill="#62b7df"/><path d="M68 205H402L390 355H80Z" fill="#668346"/><path d="M25 355H445L470 550H0Z" fill="#26343c"/><path d="M60 205H410" stroke="#f7c948" stroke-width="7"/><text x="235" y="191" text-anchor="middle" class="w">HORIZONTE ESTABLE</text><path d="M235 355V520M130 445H340" stroke="#aebfc8" stroke-width="7"/><text x="235" y="590" text-anchor="middle" class="l">Referencia exterior estable</text></g><g transform="translate(1080 145)"><text x="235" y="-20" text-anchor="middle" class="h">DESCENSO</text><rect width="470" height="550" rx="22" fill="#17242c"/><path d="M35 45H435L395 355H75Z" fill="#62b7df"/><path d="M68 135H402L390 355H80Z" fill="#668346"/><path d="M25 355H445L470 550H0Z" fill="#26343c"/><path d="M60 135H410" stroke="#f7c948" stroke-width="7"/><text x="235" y="121" text-anchor="middle" class="w">HORIZONTE MÁS ALTO</text><path d="M235 355V520M130 445H340" stroke="#aebfc8" stroke-width="7"/><text x="235" y="590" text-anchor="middle" class="l">Morro por debajo del horizonte</text></g><text x="800" y="800" text-anchor="middle" font-family="Arial" font-size="25" fill="#17364a">Mira fuera para notar la actitud; vuelve a la PFD para confirmar altitud, velocidad y tendencia vertical.</text></svg>
