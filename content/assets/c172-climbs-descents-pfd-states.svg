<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PFD G1000 del C172: ascenso, nivelado y descenso</title><desc id="desc">Tres recreaciones fieles y comparables de la pantalla primaria de vuelo G1000. Cada una muestra la actitud, la cinta de velocidad, la cinta de altitud con tendencia y el indicador vertical.</desc>
  <style>.h{font:700 31px Arial;fill:#17364a}.s{font:20px Arial;fill:#eaf4f8}.l{font:700 20px Arial;fill:#17364a}.n{font:700 27px Arial;fill:#fff}.tick{stroke:#fff;stroke-width:4}.box{fill:#121d24;stroke:#90a6b1;stroke-width:3}</style><rect width="1600" height="900" fill="#f5f8fa"/><text x="800" y="55" text-anchor="middle" class="h">PFD G1000 · COMPARA LA TENDENCIA, NO COPIES LOS NÚMEROS</text><text x="800" y="88" text-anchor="middle" font-family="Arial" font-size="20" fill="#466174">Las tres pantallas conservan la misma disposición: velocidad a la izquierda, actitud al centro, altitud y VSI a la derecha.</text>
  <g transform="translate(55 145)"><text x="230" y="-22" text-anchor="middle" class="h">ASCENSO</text><rect width="460" height="600" rx="16" fill="#111a20" stroke="#526975" stroke-width="8"/><g transform="translate(30 60)"><rect width="65" height="350" class="box"/><text x="32" y="35" text-anchor="middle" class="s">IAS</text><text x="32" y="90" text-anchor="middle" class="n">90</text><path d="M52 110V300" stroke="#2de172" stroke-width="7"/><rect x="100" width="245" height="350" fill="#1971aa"/><path d="M100 192H345" stroke="#fff" stroke-width="5"/><path d="M100 192L345 145V350H100Z" fill="#895a32"/><g class="tick"><path d="M190 105H255M205 145H240M175 240H270M190 285H255"/></g><path d="M125 195H190L222 170L255 195H320L270 220H175Z" fill="#f7c948"/><text x="222" y="132" text-anchor="middle" class="s">MORRO ARRIBA</text><rect x="350" width="70" height="350" class="box"/><text x="385" y="35" text-anchor="middle" class="s">ALT</text><text x="385" y="90" text-anchor="middle" class="n">5 200</text><path d="M365 200l20 -25 20 25" fill="none" stroke="#48b7ff" stroke-width="6"/><text x="385" y="290" text-anchor="middle" class="s">↑</text><text x="385" y="320" text-anchor="middle" class="s">VSI +</text></g><rect x="35" y="445" width="390" height="110" rx="9" fill="#e9f5ed"/><text x="230" y="480" text-anchor="middle" class="l">OBSERVA</text><text x="230" y="512" text-anchor="middle" class="l">Actitud arriba · altitud subiendo · VSI positivo</text></g>
  <g transform="translate(570 145)"><text x="230" y="-22" text-anchor="middle" class="h">NIVELADO</text><rect width="460" height="600" rx="16" fill="#111a20" stroke="#526975" stroke-width="8"/><g transform="translate(30 60)"><rect width="65" height="350" class="box"/><text x="32" y="35" text-anchor="middle" class="s">IAS</text><text x="32" y="90" text-anchor="middle" class="n">100</text><path d="M52 110V300" stroke="#2de172" stroke-width="7"/><rect x="100" width="245" height="350" fill="#1971aa"/><rect x="100" y="175" width="245" height="175" fill="#895a32"/><path d="M100 175H345" stroke="#fff" stroke-width="5"/><g class="tick"><path d="M190 90H255M205 135H240M175 220H270M190 265H255"/></g><path d="M125 178H190L222 153L255 178H320L270 203H175Z" fill="#f7c948"/><text x="222" y="132" text-anchor="middle" class="s">HORIZONTE ESTABLE</text><rect x="350" width="70" height="350" class="box"/><text x="385" y="35" text-anchor="middle" class="s">ALT</text><text x="385" y="90" text-anchor="middle" class="n">5 000</text><path d="M363 250H407" stroke="#48b7ff" stroke-width="6"/><text x="385" y="320" text-anchor="middle" class="s">VSI 0</text></g><rect x="35" y="445" width="390" height="110" rx="9" fill="#edf4f7"/><text x="230" y="480" text-anchor="middle" class="l">OBSERVA</text><text x="230" y="512" text-anchor="middle" class="l">Actitud estable · altitud estable · VSI cerca de cero</text></g>
  <g transform="translate(1085 145)"><text x="230" y="-22" text-anchor="middle" class="h">DESCENSO</text><rect width="460" height="600" rx="16" fill="#111a20" stroke="#526975" stroke-width="8"/><g transform="translate(30 60)"><rect width="65" height="350" class="box"/><text x="32" y="35" text-anchor="middle" class="s">IAS</text><text x="32" y="90" text-anchor="middle" class="n">95</text><path d="M52 110V300" stroke="#2de172" stroke-width="7"/><rect x="100" width="245" height="350" fill="#1971aa"/><path d="M100 155L345 202V350H100Z" fill="#895a32"/><path d="M100 155L345 202" stroke="#fff" stroke-width="5"/><g class="tick"><path d="M190 105H255M205 145H240M175 240H270M190 285H255"/></g><path d="M125 158H190L222 133L255 158H320L270 183H175Z" fill="#f7c948"/><text x="222" y="132" text-anchor="middle" class="s">MORRO ABAJO</text><rect x="350" width="70" height="350" class="box"/><text x="385" y="35" text-anchor="middle" class="s">ALT</text><text x="385" y="90" text-anchor="middle" class="n">4 800</text><path d="M365 175l20 25 20-25" fill="none" stroke="#48b7ff" stroke-width="6"/><text x="385" y="290" text-anchor="middle" class="s">↓</text><text x="385" y="320" text-anchor="middle" class="s">VSI −</text></g><rect x="35" y="445" width="390" height="110" rx="9" fill="#fff4e8"/><text x="230" y="480" text-anchor="middle" class="l">OBSERVA</text><text x="230" y="512" text-anchor="middle" class="l">Actitud abajo · altitud bajando · VSI negativo</text></g>
  <text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="25" fill="#17364a">Haz una entrada pequeña, centra el yoke y confirma la misma tendencia en más de una pasada.</text>
</svg>
