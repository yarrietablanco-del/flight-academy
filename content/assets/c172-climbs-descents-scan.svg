<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Barrido para comprobar ascenso o descenso</title>
  <desc id="desc">Flujo conceptual que conecta actitud, altitud, velocidad y potencia con la decisión de corregir una vez o continuar observando.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.m{font-size:21px}.box{fill:#fff;stroke:#1976d2;stroke-width:3}.decision{fill:#fff7e6;stroke:#ef6c00;stroke-width:3}.arrow{stroke:#475467;stroke-width:4;fill:none;marker-end:url(#head)}</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475467"/></marker></defs>
  <rect width="1200" height="675" fill="#f7f9fc"/><text x="600" y="60" text-anchor="middle" class="h">Una corrección se decide con tendencia, no con una lectura aislada</text>
  <rect x="55" y="175" width="210" height="125" rx="18" class="box"/><text x="160" y="225" text-anchor="middle" class="h">1. ACTITUD</text><text x="160" y="262" text-anchor="middle" class="m">¿Qué hace el morro</text><text x="160" y="287" text-anchor="middle" class="m">respecto al horizonte?</text>
  <rect x="340" y="175" width="210" height="125" rx="18" class="box"/><text x="445" y="225" text-anchor="middle" class="h">2. ALTITUD</text><text x="445" y="262" text-anchor="middle" class="m">¿Sube o baja al volver</text><text x="445" y="287" text-anchor="middle" class="m">a mirarla?</text>
  <rect x="625" y="175" width="210" height="125" rx="18" class="box"/><text x="730" y="225" text-anchor="middle" class="h">3. VELOCIDAD</text><text x="730" y="262" text-anchor="middle" class="m">¿La energía acompaña</text><text x="730" y="287" text-anchor="middle" class="m">la trayectoria?</text>
  <rect x="910" y="175" width="235" height="125" rx="18" class="decision"/><text x="1027" y="225" text-anchor="middle" class="h">4. DECIDE</text><text x="1027" y="262" text-anchor="middle" class="m">Tendencia repetida:</text><text x="1027" y="287" text-anchor="middle" class="m">cambia actitud o potencia</text>
  <path d="M265 237H340M550 237H625M835 237H910" class="arrow"/>
  <path d="M1027 330V435H445V300" class="arrow"/><text x="730" y="410" text-anchor="middle" class="m">Tras un cambio pequeño, vuelve al barrido y observa antes de tocar otra vez.</text>
  <rect x="220" y="505" width="760" height="88" rx="16" fill="#e8f3ff" stroke="#1976d2" stroke-width="2"/><text x="600" y="542" text-anchor="middle" class="h">Si no hay tendencia clara: no persigas una cifra.</text><text x="600" y="573" text-anchor="middle" class="m">Mantén la actitud, espera otra pasada y conserva margen sobre el terreno.</text>
</svg>
