<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Aproximación estable hacia la pista</title>
  <desc id="desc">Diagrama lateral conceptual: la aeronave sigue una trayectoria continua hacia la zona de toma mientras pista, dirección y trayectoria permanecen reconocibles.</desc>
  <rect width="1200" height="700" fill="#071a2b"/>
  <path d="M0 556H1200" stroke="#8fb3c9" stroke-width="4"/>
  <path d="M720 556 L1170 556 L1060 635 L610 635 Z" fill="#314d60" stroke="#b8d7e7" stroke-width="3"/>
  <path d="M770 573 L1100 573" stroke="#f4d35e" stroke-width="8" stroke-dasharray="32 20"/>
  <text x="855" y="670" fill="#e8f3f8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">PISTA: referencia por delante</text>
  <path d="M90 155 C310 170, 485 265, 670 470" fill="none" stroke="#52d6a0" stroke-width="13" stroke-linecap="round"/>
  <path d="M656 439 L694 474 L648 487" fill="#52d6a0"/>
  <g transform="translate(427 260) rotate(27)">
    <path d="M0 32 L92 32 L118 47 L92 60 L0 60 L-25 47 Z" fill="#f6f7f2" stroke="#102a3a" stroke-width="4"/>
    <path d="M31 32 L0 0 L12 0 L62 32" fill="#d7ebf3" stroke="#102a3a" stroke-width="4"/>
    <path d="M67 60 L46 91 L58 91 L93 60" fill="#d7ebf3" stroke="#102a3a" stroke-width="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="30" fill="#e8f3f8">
    <text x="94" y="92" font-weight="700">APROXIMACIÓN ESTABLE</text>
    <text x="95" y="125">Trayectoria continua y pista reconocible</text>
  </g>
  <g fill="#52d6a0">
    <circle cx="238" cy="184" r="11"/><circle cx="479" cy="280" r="11"/><circle cx="655" cy="457" r="11"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="27" fill="#d9f3e7">
    <text x="175" y="235">1. Pista localizada</text>
    <text x="408" y="335">2. Tendencia predecible</text>
    <text x="600" y="415">3. Alineación sostenible</text>
  </g>
  <rect x="80" y="590" width="445" height="68" rx="12" fill="#14384b" stroke="#52d6a0" stroke-width="2"/>
  <text x="302" y="633" fill="#f2fffa" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Si la tendencia deja de ser clara, decide frustrar.</text>
</svg>
