<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Corrección pequeña frente a sobrecorrección</title><desc id="desc">Comparación de la tendencia estable después de una entrada pequeña con oscilaciones causadas por correcciones continuas.</desc><rect width="960" height="540" fill="#f7fafc"/><text x="480" y="46" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#16324f">CORRIGE UNA VEZ Y ESPERA</text><g font-family="Arial"><rect x="45" y="85" width="405" height="365" rx="16" fill="#e6f3ea" stroke="#23613b" stroke-width="4"/><text x="248" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#23613b">SÍ: pequeño + esperar</text><path d="M85 275H415" stroke="#5b758c" stroke-width="3" stroke-dasharray="8 8"/><text x="90" y="264" font-size="15" fill="#314e68">referencia</text><path d="M85 195 C145 198 170 225 210 250 S315 272 415 274" fill="none" stroke="#23613b" stroke-width="8"/><circle cx="118" cy="198" r="10" fill="#f9c74f"/><text x="80" y="345" font-size="18" fill="#16324f">1. Entrada breve</text><text x="80" y="373" font-size="18" fill="#16324f">2. Yoke al centro</text><text x="80" y="401" font-size="18" fill="#16324f">3. Barrido completo</text><rect x="510" y="85" width="405" height="365" rx="16" fill="#f9e5e2" stroke="#a43e32" stroke-width="4"/><text x="712" y="122" text-anchor="middle" font-size="24" font-weight="700" fill="#a43e32">NO: corregir sin esperar</text><path d="M550 275H880" stroke="#5b758c" stroke-width="3" stroke-dasharray="8 8"/><text x="555" y="264" font-size="15" fill="#314e68">referencia</text><path d="M550 195 C590 120 625 410 665 275 S735 120 775 275 S845 410 880 230" fill="none" stroke="#a43e32" stroke-width="8"/><text x="550" y="345" font-size="18" fill="#16324f">Cada entrada tapa</text><text x="550" y="373" font-size="18" fill="#16324f">el efecto de la anterior:</text><text x="550" y="401" font-size="18" fill="#16324f">aparecen oscilaciones.</text></g><rect x="135" y="480" width="690" height="34" rx="17" fill="#e5eef4"/><text x="480" y="503" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">Después: si la desviación deja de crecer, mantén la actitud y ajusta trim solo si queda presión.</text></svg>
