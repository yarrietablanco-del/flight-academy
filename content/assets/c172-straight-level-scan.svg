<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Barrido visual para mantener vuelo recto y nivelado</title>
  <desc id="desc">Un ciclo muestra referencia de actitud, altitud, rumbo y vuelta a la actitud. El diagrama enseña a comparar tendencias en lugar de fijarse continuamente en un solo instrumento.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16324f"/></marker>
  </defs>
  <rect width="960" height="540" fill="#f7fafc"/>
  <text x="480" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#16324f">Barrido: observa, compara, vuelve a la referencia</text>
  <path d="M404 158 C520 85 697 137 724 255" fill="none" stroke="#16324f" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M724 292 C692 416 512 457 399 385" fill="none" stroke="#16324f" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M348 379 C225 415 124 308 176 203" fill="none" stroke="#16324f" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M207 178 C258 99 350 105 405 158" fill="none" stroke="#16324f" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="390" cy="160" r="75" fill="#cfe9f7" stroke="#16324f" stroke-width="5"/>
    <path d="M329 162 H451" stroke="#ffffff" stroke-width="6"/><path d="M348 166 H432 L390 142 Z" fill="#16324f"/>
    <text x="390" y="260" font-size="23" font-weight="700" fill="#16324f">1. Actitud</text>
    <text x="390" y="286" font-size="17" fill="#314e68">¿Sigue la referencia?</text>
    <circle cx="730" cy="272" r="75" fill="#d9f0df" stroke="#16324f" stroke-width="5"/>
    <path d="M730 220 V324 M700 246 H760 M700 298 H760" stroke="#16324f" stroke-width="5"/>
    <text x="730" y="372" font-size="23" font-weight="700" fill="#16324f">2. Altitud</text>
    <text x="730" y="398" font-size="17" fill="#314e68">¿Se mantiene o deriva?</text>
    <circle cx="390" cy="385" r="75" fill="#fde9bf" stroke="#16324f" stroke-width="5"/>
    <circle cx="390" cy="385" r="37" fill="none" stroke="#16324f" stroke-width="5"/><path d="M390 348 V385 L420 403" stroke="#16324f" stroke-width="5"/>
    <text x="390" y="485" font-size="23" font-weight="700" fill="#16324f">3. Rumbo</text>
    <text x="390" y="511" font-size="17" fill="#314e68">¿La dirección se aleja?</text>
    <circle cx="175" cy="190" r="53" fill="#e6eef5" stroke="#16324f" stroke-width="5"/>
    <text x="175" y="184" font-family="Arial, sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">4. Vuelve</text>
    <text x="175" y="207" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" fill="#314e68">a actitud</text>
  </g>
  <text x="480" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#16324f">El barrido detecta tendencias; la corrección se hace con una entrada pequeña y después se vuelve a comprobar.</text>
</svg>
