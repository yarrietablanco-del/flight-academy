<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia conceptual de despegue y ascenso inicial</title>
  <desc id="desc">Un Cessna conceptual recorre una pista, se separa del suelo y asciende hacia una zona con margen. Las etiquetas describen observaciones, no valores de operación.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#0b5e75"/></marker>
    <style>
      .bg{fill:#f5fbfc}.panel{fill:#fff;stroke:#b9d5dc;stroke-width:2}.runway{fill:#4b5563}.mark{stroke:#fff;stroke-width:8;stroke-dasharray:30 22}.line{fill:none;stroke:#0b5e75;stroke-width:8;marker-end:url(#arrow)}.aircraft{fill:#ffffff;stroke:#123b4a;stroke-width:4}.label{font:700 24px Arial,sans-serif;fill:#123b4a}.small{font:400 19px Arial,sans-serif;fill:#244c5b}.tag{fill:#d8f1f5;stroke:#0b5e75;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text class="label" x="60" y="58">Despegue: observa la secuencia, no una cifra universal</text>
  <text class="small" x="60" y="88">Este diagrama conceptual no sustituye el POH, una lista de comprobación ni una instrucción real.</text>
  <rect class="panel" x="48" y="125" width="1104" height="410" rx="18"/>
  <path class="runway" d="M75 395 H660 V485 H75z"/>
  <path class="mark" d="M112 440 H622"/>
  <path class="line" d="M166 326 C350 326 497 326 632 328 C720 328 765 294 828 235 C896 174 978 164 1082 164"/>
  <g transform="translate(233 307)"><path class="aircraft" d="M0 17 L56 0 L42 15 L105 23 L105 34 L42 39 L55 55 L0 38 L-45 38 L-62 28 L-45 17z"/></g>
  <g transform="translate(645 305) rotate(-12)"><path class="aircraft" d="M0 17 L56 0 L42 15 L105 23 L105 34 L42 39 L55 55 L0 38 L-45 38 L-62 28 L-45 17z"/></g>
  <g transform="translate(884 183) rotate(-28)"><path class="aircraft" d="M0 17 L56 0 L42 15 L105 23 L105 34 L42 39 L55 55 L0 38 L-45 38 L-62 28 L-45 17z"/></g>
  <g><rect class="tag" x="104" y="185" width="255" height="90" rx="12"/><text class="label" x="125" y="218">1. Carrera</text><text class="small" x="125" y="247">Mira alineación y control.</text></g>
  <g><rect class="tag" x="478" y="160" width="257" height="95" rx="12"/><text class="label" x="499" y="193">2. Separación</text><text class="small" x="499" y="222">Confirma que ya vuela.</text></g>
  <g><rect class="tag" x="850" y="325" width="244" height="100" rx="12"/><text class="label" x="871" y="358">3. Ascenso</text><text class="small" x="871" y="387">Busca margen y tendencia.</text></g>
  <text class="small" x="762" y="485">Zona segura: continúa solo al tener terreno y trayectoria bajo control.</text>
</svg>
