<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Relación entre distancia, velocidad sobre el suelo, tiempo y combustible</title>
  <desc id="desc">Diagrama conceptual: distancia dividida por velocidad sobre el suelo produce tiempo planificado; tiempo multiplicado por consumo produce combustible planificado.</desc>
  <defs><style>.bg{fill:#071725}.card{fill:#102a3d;stroke:#5eb6e8;stroke-width:2}.label{fill:#d9f2ff;font:600 26px Arial,sans-serif}.value{fill:#7dd3fc;font:700 36px Arial,sans-serif}.note{fill:#b9cad5;font:20px Arial,sans-serif}.formula{fill:#ffffff;font:700 34px Arial,sans-serif}.arrow{stroke:#f7c948;stroke-width:5;fill:none}.tag{fill:#163c54}.tagtext{fill:#f7c948;font:700 18px Arial,sans-serif}</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#f7c948"/></marker></defs>
  <rect class="bg" width="1200" height="675" rx="28"/>
  <text x="70" y="75" class="label" font-size="34">Plan de práctica: relaciones que sí puedes comprobar</text>
  <text x="70" y="112" class="note">Usa únicamente los datos y las unidades que muestre tu propia sesión de MSFS.</text>
  <rect class="card" x="70" y="185" width="270" height="150" rx="18"/><text x="105" y="235" class="label">Distancia del tramo</text><text x="105" y="290" class="value">DISTANCIA</text>
  <rect class="card" x="70" y="420" width="270" height="150" rx="18"/><text x="105" y="470" class="label">Velocidad sobre suelo</text><text x="105" y="525" class="value">GROUND SPEED</text>
  <path class="arrow" d="M355 260 H455" marker-end="url(#head)"/><path class="arrow" d="M355 495 H455 V320" marker-end="url(#head)"/>
  <rect class="tag" x="388" y="360" width="110" height="36" rx="18"/><text x="410" y="385" class="tagtext">DIVIDIR</text>
  <rect class="card" x="510" y="255" width="260" height="160" rx="18"/><text x="550" y="306" class="label">Tiempo previsto</text><text x="550" y="365" class="formula">D ÷ GS</text>
  <path class="arrow" d="M785 335 H875" marker-end="url(#head)"/>
  <rect class="tag" x="798" y="270" width="130" height="36" rx="18"/><text x="816" y="295" class="tagtext">MULTIPLICAR</text>
  <rect class="card" x="930" y="185" width="220" height="150" rx="18"/><text x="960" y="235" class="label">Consumo</text><text x="960" y="290" class="value">POR TIEMPO</text>
  <rect class="card" x="930" y="420" width="220" height="150" rx="18"/><text x="958" y="470" class="label">Combustible</text><text x="958" y="525" class="formula">T × consumo</text>
  <path class="arrow" d="M1040 350 V405" marker-end="url(#head)"/>
  <text x="70" y="630" class="note">Después: compara el tiempo transcurrido y el combustible restante con tu anotación; una diferencia es una señal para revisar, no para adivinar.</text>
</svg>
