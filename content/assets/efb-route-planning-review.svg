<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Comparación conceptual entre una ruta VFR revisada y una sin revisar</title>
  <desc id="desc">Dos paneles comparan una ruta que enlaza origen, referencia y destino con otra que tiene un tramo sin confirmar. Una flecha conduce desde la revisión a iniciar la sesión de simulación.</desc>
  <defs><style>.bg{fill:#071b2b}.panel{fill:#0d2b3b;stroke-width:4}.ok{stroke:#55d993}.warn{stroke:#f6b74b}.line{fill:none;stroke:#49c9ff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#f6b74b;stroke-width:8;stroke-dasharray:15 12}.text{font-family:Arial,sans-serif;fill:#edfaff}.head{font-size:32px;font-weight:700}.body{font-size:23px}.muted{fill:#b6d0da}.dot{fill:#102c3c;stroke:#edfaff;stroke-width:3}</style><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#55d993"/></marker></defs>
  <rect class="bg" width="1200" height="675" rx="28"/>
  <text class="text head" x="70" y="79">Antes del arranque, la decisión es revisar, no adivinar</text>
  <rect class="panel warn" x="70" y="125" width="490" height="392" rx="24"/>
  <text class="text head" x="108" y="180">SIN REVISAR</text>
  <text class="text body muted" x="108" y="216">Falta confirmar un tramo o el destino.</text>
  <path class="line" d="M143 403 L289 303"/><path class="dash" d="M289 303 L464 374"/>
  <circle class="dot" cx="143" cy="403" r="24"/><circle class="dot" cx="289" cy="303" r="24"/><circle class="dot" cx="464" cy="374" r="24"/>
  <text class="text body" x="112" y="459">Origen</text><text class="text body" x="250" y="268">Referencia</text><text class="text body" x="423" y="429">¿Destino?</text>
  <text class="text body" x="108" y="489">Acción: detenerse y corregir el plan.</text>
  <rect class="panel ok" x="640" y="125" width="490" height="392" rx="24"/>
  <text class="text head" x="678" y="180">REVISADA</text>
  <text class="text body muted" x="678" y="216">La secuencia y el destino son reconocibles.</text>
  <path class="line" d="M713 403 L859 303 L1034 374"/>
  <circle class="dot" cx="713" cy="403" r="24"/><circle class="dot" cx="859" cy="303" r="24"/><circle class="dot" cx="1034" cy="374" r="24"/>
  <text class="text body" x="682" y="459">Origen</text><text class="text body" x="820" y="268">Referencia</text><text class="text body" x="990" y="429">Destino</text>
  <text class="text body" x="678" y="489">Acción: guardar y cargar la sesión.</text>
  <path d="M600 559V625" stroke="#55d993" stroke-width="7" marker-end="url(#arr)"/>
  <text class="text body" x="632" y="584">Revisar cada tramo</text>
  <text class="text body muted" x="337" y="647">El diagrama enseña una lógica de revisión; no representa una carta ni una EFB real.</text>
</svg>
