<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">HDG convierte un rumbo seleccionado en una trayectoria supervisada</title>
  <desc id="desc">Diagrama conceptual superior: un avión se desvía de una línea de rumbo seleccionada y vuelve a ella mientras el piloto comprueba el resultado.</desc>
  <rect width="960" height="440" fill="#071827"/>
  <text x="54" y="62" fill="#f1f7fb" font-family="Arial, sans-serif" font-size="29" font-weight="700">HDG: el objetivo es un rumbo, no una ruta GPS</text>
  <path d="M144 218 H836" fill="none" stroke="#35c7ff" stroke-width="8" stroke-dasharray="18 14"/>
  <text x="618" y="191" fill="#35c7ff" font-family="Arial, sans-serif" font-size="21">rumbo seleccionado</text>
  <path d="M157 316 C292 312 320 220 461 218 S689 218 825 218" fill="none" stroke="#f1f7fb" stroke-width="7" stroke-linecap="round"/>
  <path d="M449 218 l-30 -17 v34z" fill="#f1f7fb"/>
  <circle cx="161" cy="316" r="20" fill="#d94673"/><text x="87" y="356" fill="#d9e8ef" font-family="Arial, sans-serif" font-size="20">antes: desvío</text>
  <circle cx="820" cy="218" r="20" fill="#39d98a"/><text x="735" y="260" fill="#d9e8ef" font-family="Arial, sans-serif" font-size="20">después: rumbo</text>
  <rect x="55" y="376" width="850" height="42" rx="8" fill="#112b3c"/>
  <text x="77" y="404" fill="#f1f7fb" font-family="Arial, sans-serif" font-size="20">Supervisa la tendencia y la indicación de modo; no asumas que HDG seguirá el plan de vuelo.</text>
</svg>
