<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Fuente y desviación del CDI</title><desc id="desc">El selector de fuente determina qué guía interpreta la barra CDI; el ejemplo muestra GPS seleccionado.</desc>
  <rect width="960" height="440" fill="#071827"/><text x="56" y="62" fill="#f1f7fb" font-family="Arial, sans-serif" font-size="29" font-weight="700">CDI: primero identifica la fuente de navegación</text>
  <rect x="72" y="130" width="220" height="124" rx="14" fill="#1e3444" stroke="#7c9eb0" stroke-width="3"/><text x="108" y="178" fill="#c7dbe5" font-family="Arial, sans-serif" font-size="22">FUENTE</text><text x="116" y="222" fill="#35c7ff" font-family="Arial, sans-serif" font-size="38" font-weight="700">GPS</text>
  <path d="M322 192 H448" stroke="#35c7ff" stroke-width="8"/><path d="M448 192 l-24 -15 v30z" fill="#35c7ff"/>
  <rect x="480" y="112" width="340" height="186" rx="18" fill="#112b3c" stroke="#a8dff5" stroke-width="3"/><text x="580" y="153" fill="#e7f5fb" font-family="Arial, sans-serif" font-size="22">INDICADOR CDI</text><path d="M525 215 H774" stroke="#e7f5fb" stroke-width="5"/><path d="M650 170 V260" stroke="#7c9eb0" stroke-width="4"/><rect x="680" y="170" width="18" height="90" rx="8" fill="#d94673"/><text x="540" y="282" fill="#b7d2df" font-family="Arial, sans-serif" font-size="18">barra desplazada = no estás sobre la guía seleccionada</text>
  <text x="83" y="343" fill="#f1f7fb" font-family="Arial, sans-serif" font-size="22">Lee “GPS” antes de interpretar la desviación lateral.</text><text x="83" y="382" fill="#b7d2df" font-family="Arial, sans-serif" font-size="20">La apariencia y el modo de cambiar fuente dependen de la variante instalada.</text>
</svg>
