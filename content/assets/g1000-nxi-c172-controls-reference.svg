<text x="865" y="665" fill="#ffdc68" font-family="Arial" font-size="18">Regla de supervisión</text>
<text x="865" y="700" fill="#e7ecef" font-family="Arial" font-size="17">selección → anunciación/mode → respuesta → verificación</text>
<rect x="70" y="775" width="1460" height="72" rx="12" fill="#192126"/>
<text x="100" y="807" fill="#9fe6ff" font-family="Arial" font-size="17">FPL y Direct-To cambian la guía. CDI SOURCE dice qué señal estás interpretando. AP/HDG/NAV/ALT son modos: no basta con pulsarlos; confirma la anunciación y la respuesta.</text>
<text x="100" y="834" fill="#9caab1" font-family="Arial" font-size="14">Basado en MSFS 2024 G1000 NXi V2 + Garmin G1000 NXi Cessna NAV III. No contiene frecuencias ni valores operacionales inventados.</text>
</svg>