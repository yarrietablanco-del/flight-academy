<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Dos vistas de una aproximación: guiado lateral y guiado vertical</title>
  <desc id="desc">A la izquierda una vista superior muestra una aeronave que converge hacia el eje de pista. A la derecha una vista lateral muestra una aeronave que converge hacia una trayectoria de descenso. Las dos vistas separan dirección y altura.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1877b8"/></marker>
    <style>.bg{fill:#f7fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.heading{font:700 30px Arial,sans-serif;fill:#12263a}.label{font:600 22px Arial,sans-serif;fill:#243b53}.small{font:18px Arial,sans-serif;fill:#486581}.line{stroke:#1877b8;stroke-width:7;fill:none;marker-end:url(#arrow)}.target{stroke:#d64545;stroke-width:7;fill:none}.runway{fill:#475569}.aircraft{fill:#1877b8}</style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text x="600" y="55" text-anchor="middle" class="heading">Una aproximación se lee en dos dimensiones</text>
  <rect class="panel" x="45" y="95" width="530" height="555" rx="20"/>
  <text x="310" y="140" text-anchor="middle" class="heading">GUIADO LATERAL</text>
  <text x="310" y="172" text-anchor="middle" class="small">¿Estoy a izquierda o derecha de la trayectoria?</text>
  <rect class="runway" x="260" y="440" width="100" height="155" rx="4"/>
  <path d="M310 235V440" class="target" stroke-dasharray="14 13"/>
  <path d="M125 265C180 300 225 330 310 420" class="line"/>
  <path class="aircraft" d="M113 252l38 12-17 9 8 27-13-17-13 17 8-27-17-9z"/>
  <text x="365" y="335" class="label">Eje de pista</text>
  <text x="365" y="365" class="small">Trayectoria vista desde arriba</text>
  <text x="310" y="625" text-anchor="middle" class="label">Corrige la posición sobre el plano horizontal</text>
  <rect class="panel" x="625" y="95" width="530" height="555" rx="20"/>
  <text x="890" y="140" text-anchor="middle" class="heading">GUIADO VERTICAL</text>
  <text x="890" y="172" text-anchor="middle" class="small">¿Estoy por encima o debajo de la trayectoria?</text>
  <path d="M690 555H1090" stroke="#718096" stroke-width="5"/>
  <rect class="runway" x="1000" y="510" width="120" height="45" rx="4"/>
  <path d="M690 275L1000 510" class="target" stroke-dasharray="14 13"/>
  <path d="M710 230C785 255 850 320 960 460" class="line"/>
  <path class="aircraft" d="M698 217l38 12-17 9 8 27-13-17-13 17 8-27-17-9z"/>
  <text x="705" y="400" class="label">Trayectoria de descenso</text>
  <text x="705" y="430" class="small">Trayectoria vista de lado</text>
  <text x="890" y="625" text-anchor="middle" class="label">Corrige la posición sobre el plano vertical</text>
</svg>
