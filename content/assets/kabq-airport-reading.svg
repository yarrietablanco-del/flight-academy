<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Recreación educativa de lectura del diagrama KABQ con HS1 HS2 HS3">
<rect width="1600" height="900" fill="#071826"/>
<text x="70" y="78" fill="#eaf5ff" font-family="Arial" font-size="41" font-weight="700">KABQ · Airport Diagram · lectura guiada</text>
<text x="70" y="118" fill="#9dc2db" font-family="Arial" font-size="24">FAA d-TPP 2608 · recreación educativa · los hotspots se leen por identificador</text>
<g font-family="Arial">
<rect x="80" y="205" width="1180" height="92" rx="16" fill="#263945" transform="rotate(-18 670 251)"/>
<text x="575" y="263" fill="white" font-size="30" transform="rotate(-18 575 263)">RWY 08 / 26</text>
<rect x="720" y="310" width="105" height="440" rx="14" fill="#324957" transform="rotate(26 772 530)"/>
<text x="780" y="530" fill="white" font-size="28" transform="rotate(-64 780 530)">RWY 03 / 21</text>
<path d="M210 455 H470 V600 H980" fill="none" stroke="#e5c15c" stroke-width="34" stroke-linecap="round"/>
<text x="240" y="430" fill="#ffe890" font-size="32">A</text><text x="500" y="570" fill="#ffe890" font-size="32">B</text><text x="835" y="650" fill="#ffe890" font-size="32">C</text>
<rect x="115" y="505" width="240" height="180" rx="16" fill="#486172"/><text x="144" y="586" fill="white" font-size="29">TERMINAL</text><text x="144" y="623" fill="#c7e3f5" font-size="24">ramp / apron</text>
<path d="M950 570 l55 -44 l55 44" fill="none" stroke="#ff6e64" stroke-width="13"/><text x="1018" y="630" fill="#ffaaa4" font-size="26">hold short</text>
<circle cx="1090" cy="410" r="46" fill="#f2b448"/><text x="1064" y="420" fill="#071826" font-size="27" font-weight="700">HS1</text>
<circle cx="1210" cy="505" r="46" fill="#f2b448"/><text x="1184" y="515" fill="#071826" font-size="27" font-weight="700">HS2</text>
<circle cx="1035" cy="700" r="46" fill="#f2b448"/><text x="1009" y="710" fill="#071826" font-size="27" font-weight="700">HS3</text>
<rect x="1275" y="180" width="270" height="555" rx="20" fill="#102b3e"/>
<text x="1310" y="235" fill="#eaf5ff" font-size="27" font-weight="700">LEE EN ORDEN</text>
<text x="1310" y="290" fill="#c7e3f5" font-size="23">1. KABQ / orientación</text><text x="1310" y="335" fill="#c7e3f5" font-size="23">2. Pista</text><text x="1310" y="380" fill="#c7e3f5" font-size="23">3. Posición</text><text x="1310" y="425" fill="#c7e3f5" font-size="23">4. Taxiways</text><text x="1310" y="470" fill="#c7e3f5" font-size="23">5. Hold short</text><text x="1310" y="515" fill="#ffe890" font-size="23">6. HS1 / HS2 / HS3</text><text x="1310" y="560" fill="#c7e3f5" font-size="23">7. Destino</text>
<text x="1310" y="625" fill="#ffe8a7" font-size="20">HS = hotspot:</text><text x="1310" y="655" fill="#ffe8a7" font-size="20">zona publicada que</text><text x="1310" y="685" fill="#ffe8a7" font-size="20">merece atención extra.</text>
</g>
<text x="80" y="835" fill="#9dc2db" font-family="Arial" font-size="23">Un hotspot no autoriza ni prohíbe por sí solo: te obliga a anticipar el punto complejo y verificar la ruta.</text>
</svg>