<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Comparación educativa ILS y RNAV RWY 08 KABQ">
<rect width="1600" height="900" fill="#071826"/>
<g font-family="Arial">
<text x="70" y="75" fill="#eaf5ff" font-size="39" font-weight="700">KABQ · misma pista, guiado diferente</text>
<text x="70" y="115" fill="#9dc2db" font-size="23">FAA d-TPP 2608 · APP CRS 079° en ambas · no transfieras guiado ni mínimos</text>

<rect x="90" y="165" width="670" height="610" rx="22" fill="#102b3e"/>
<text x="130" y="225" fill="#63d7ff" font-size="34" font-weight="700">ILS OR LOC RWY 08</text>
<text x="130" y="285" fill="white" font-size="27">LOC/DME I-SPT 111.9</text>
<text x="130" y="330" fill="white" font-size="27">APP CRS 079°</text>
<text x="130" y="390" fill="#63d7ff" font-size="27" font-weight="700">ILS: localizer + glideslope</text>
<text x="130" y="440" fill="#c7e3f5" font-size="25">GS 3.00° publicado</text>
<text x="130" y="500" fill="#ffe890" font-size="24">Carta combinada: S-ILS 8 / S-LOC 8</text>
<text x="130" y="560" fill="#ffaaa4" font-size="24">Lee mínimos y missed approach de esta carta</text>
<rect x="130" y="625" width="570" height="92" rx="14" fill="#173c53"/>
<text x="155" y="660" fill="white" font-size="22">Vertical ILS: el glideslope sí forma parte del procedimiento</text>
<text x="155" y="696" fill="#c7e3f5" font-size="21">No lo copies a una RNAV solo porque comparta pista.</text>

<rect x="840" y="165" width="670" height="610" rx="22" fill="#102b3e"/>
<text x="880" y="225" fill="#ffbd69" font-size="34" font-weight="700">RNAV (GPS) Y RWY 08</text>
<text x="880" y="285" fill="white" font-size="27">RNAV / GPS</text>
<text x="880" y="330" fill="white" font-size="27">APP CRS 079°</text>
<text x="880" y="390" fill="#ffbd69" font-size="27" font-weight="700">MINIMUMS: LNAV MDA</text>
<text x="880" y="440" fill="#ffe890" font-size="26">VDA 3.00° · ADVISORY</text>
<text x="880" y="490" fill="#ffaaa4" font-size="23">NO = glideslope ILS</text>
<text x="880" y="530" fill="#ffaaa4" font-size="23">NO = glidepath aprobado del procedimiento</text>
<text x="880" y="585" fill="#c7e3f5" font-size="24">JILUG (IF/IAF) · COBKA (FAF)</text>
<rect x="880" y="625" width="570" height="92" rx="14" fill="#173c53"/>
<text x="905" y="660" fill="white" font-size="22">El VDA ayuda a visualizar una pendiente.</text>
<text x="905" y="696" fill="#c7e3f5" font-size="21">La MDA y la carta concreta siguen gobernando esta aproximación.</text>
</g>
<text x="260" y="845" fill="#9dc2db" font-family="Arial" font-size="23">Regla: misma pista + mismo 079° ≠ mismo procedimiento, guiado, mínimos o frustrada.</text>
</svg>