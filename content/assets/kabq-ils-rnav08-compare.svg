<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Comparación educativa ILS y RNAV pista 08 KABQ">
<rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="70" y="78" fill="#eaf5ff" font-size="40" font-weight="700">KABQ · misma pista, dos cartas que no se intercambian</text><text x="70" y="120" fill="#9dc2db" font-size="24">FAA d-TPP 2608 · compara cada campo dentro de su propio procedimiento</text><rect x="95" y="185" width="650" height="560" rx="22" fill="#102b3e"/><text x="135" y="245" fill="#63d7ff" font-size="35" font-weight="700">ILS OR LOC RWY 08</text><text x="135" y="310" fill="white" font-size="28">I-SPT · 111.9</text><text x="135" y="360" fill="white" font-size="28">APP CRS 079°</text><text x="135" y="420" fill="#c7e3f5" font-size="26">guiado: localizer / glideslope</text><text x="135" y="485" fill="#ffe890" font-size="26">FAF: GZELL</text><text x="135" y="550" fill="#ffaaa4" font-size="26">mínimos y frustrada: esta carta</text><rect x="855" y="185" width="650" height="560" rx="22" fill="#102b3e"/><text x="895" y="245" fill="#ffbd69" font-size="35" font-weight="700">RNAV (GPS) Y RWY 08</text><text x="895" y="310" fill="white" font-size="28">GPS / RNAV</text><text x="895" y="360" fill="white" font-size="28">APP CRS 079°</text><text x="895" y="420" fill="#c7e3f5" font-size="26">guiado: navegación RNAV / glidepath si aplica</text><text x="895" y="485" fill="#ffe890" font-size="26">IF/IAF: JILUG · FAF: COBKA</text><text x="895" y="550" fill="#ffaaa4" font-size="26">mínimos y frustrada: esta carta</text><path d="M760 620 H840" stroke="#eaf5ff" stroke-width="5"/><text x="610" y="825" fill="#9dc2db" font-size="25">Compartir pista y curso final no permite copiar frecuencia, fixes, mínimos ni frustrada de una carta a la otra.</text></g></svg>
