<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Lectura educativa de ADYOS THREE y SNDIA FOUR">
<rect width="1600" height="900" fill="#071826"/><g font-family="Arial"><text x="70" y="78" fill="#eaf5ff" font-size="40" font-weight="700">KABQ · SID / STAR · lectura por capas</text><text x="70" y="120" fill="#9dc2db" font-size="24">FAA d-TPP 2608 · datos selectivos para reconocer la carta, no para ejecutar un vuelo real</text><rect x="80" y="180" width="680" height="580" rx="22" fill="#102b3e"/><text x="115" y="240" fill="#63d7ff" font-size="35" font-weight="700">ADYOS THREE (RNAV)</text><text x="115" y="283" fill="#c7e3f5" font-size="25">Salida KABQ · rwy 21/26 según carta</text><path d="M150 650 C270 590 330 470 430 450 S570 320 670 260" fill="none" stroke="#4fd9ff" stroke-width="11"/><circle cx="300" cy="525" r="16" fill="#ffe890"/><circle cx="430" cy="450" r="16" fill="#ffe890"/><circle cx="570" cy="350" r="16" fill="#ffe890"/><text x="220" y="510" fill="white" font-size="24">ASTAH</text><text x="445" y="430" fill="white" font-size="24">ADYOS</text><text x="575" y="330" fill="white" font-size="24">LVSTA</text><text x="120" y="720" fill="#ffe890" font-size="23">Lee: título → aplicabilidad → fixes/tracks → restricciones → transición/notas.</text><rect x="840" y="180" width="680" height="580" rx="22" fill="#102b3e"/><text x="875" y="240" fill="#ffbd69" font-size="35" font-weight="700">SNDIA FOUR (RNAV)</text><text x="875" y="283" fill="#c7e3f5" font-size="25">Llegada hacia KABQ · continuidad se verifica antes de la aproximación</text><path d="M1450 300 C1330 340 1250 450 1130 470 S1010 590 900 650" fill="none" stroke="#ffbd69" stroke-width="11"/><circle cx="1320" cy="365" r="16" fill="#ffe890"/><circle cx="1175" cy="455" r="16" fill="#ffe890"/><circle cx="1010" cy="555" r="16" fill="#ffe890"/><text x="1305" y="340" fill="white" font-size="24">SNDIA</text><text x="1188" y="435" fill="white" font-size="24">VLCNO</text><text x="1015" y="535" fill="white" font-size="24">CRSTN</text><text x="875" y="720" fill="#ffe890" font-size="23">Lee desde la transición: fixes → tracks → restricciones → notas → final publicado.</text></g></svg>
