<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Lectura educativa fiel de ADYOS THREE y SNDIA FOUR">
<rect width="1600" height="900" fill="#071826"/>
<g font-family="Arial">
<text x="70" y="72" fill="#eaf5ff" font-size="38" font-weight="700">KABQ · SID / STAR · lectura por capas</text>
<text x="70" y="112" fill="#9dc2db" font-size="23">FAA d-TPP 2608 · recreación educativa · aprende a leer; no implica aplicabilidad al C172</text>

<rect x="70" y="160" width="700" height="650" rx="22" fill="#102b3e"/>
<text x="105" y="215" fill="#63d7ff" font-size="33" font-weight="700">ADYOS THREE (RNAV)</text>
<text x="105" y="255" fill="#ffb3ad" font-size="25" font-weight="700">FOR TURBOJET AIRCRAFT ONLY</text>
<text x="105" y="292" fill="#c7e3f5" font-size="23">RWY 21/26 · GUP / ZUN transitions</text>
<rect x="105" y="320" width="600" height="95" rx="14" fill="#173c53"/>
<text x="130" y="356" fill="#ffe890" font-size="24" font-weight="700">TAKEOFF MINIMUMS</text>
<text x="130" y="391" fill="white" font-size="24">RWY 21/26: minimum climb 500 ft/NM to 5860 ft</text>
<text x="130" y="430" fill="#ffcf8f" font-size="22">RWY 21: do not exceed 210 kt until passing 5860 ft</text>
<path d="M130 685 C240 615 305 535 395 505 S535 390 660 345" fill="none" stroke="#4fd9ff" stroke-width="10"/>
<circle cx="270" cy="585" r="14" fill="#ffe890"/>
<circle cx="410" cy="500" r="14" fill="#ffe890"/>
<circle cx="575" cy="410" r="14" fill="#ffe890"/>
<text x="208" y="572" fill="white" font-size="23">ASTAH</text>
<text x="425" y="486" fill="white" font-size="23">ADYOS</text>
<text x="588" y="397" fill="white" font-size="23">LVSTA</text>
<text x="105" y="765" fill="#c7e3f5" font-size="21">Orden: aplicabilidad → pista → restricciones → fixes/tracks → transición.</text>

<rect x="830" y="160" width="700" height="650" rx="22" fill="#102b3e"/>
<text x="865" y="215" fill="#ffbd69" font-size="33" font-weight="700">SNDIA FOUR (RNAV)</text>
<text x="865" y="255" fill="#ffb3ad" font-size="25" font-weight="700">TURBOJET AIRCRAFT ONLY</text>
<text x="865" y="292" fill="#c7e3f5" font-size="23">Landing RWY 08 · conserva todos los fixes relevantes</text>
<path d="M1430 345 C1345 380 1280 440 1215 485 S1080 585 930 675" fill="none" stroke="#ffbd69" stroke-width="10"/>
<circle cx="1390" cy="360" r="14" fill="#ffe890"/>
<circle cx="1260" cy="455" r="14" fill="#ffe890"/>
<circle cx="1130" cy="540" r="14" fill="#ffe890"/>
<circle cx="995" cy="625" r="14" fill="#ffe890"/>
<text x="1350" y="340" fill="white" font-size="23">SNDIA</text>
<text x="1212" y="438" fill="white" font-size="23">VLCNO</text>
<text x="1085" y="523" fill="#ffe890" font-size="24" font-weight="700">ASIDE</text>
<text x="945" y="608" fill="white" font-size="23">CRSTN</text>
<rect x="875" y="670" width="590" height="82" rx="14" fill="#173c53"/>
<text x="900" y="704" fill="white" font-size="22">RWY 08: SNDIA → VLCNO → ASIDE → CRSTN</text>
<text x="900" y="735" fill="#c7e3f5" font-size="20">Luego: aproximación o vectores según la carta/instrucción aplicable.</text>
</g>
</svg>