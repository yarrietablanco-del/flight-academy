<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Relación entre SID, tramo en ruta y STAR</title>
  <desc id="desc">Diagrama conceptual de una salida publicada que conecta el aeropuerto de salida con la ruta en ruta, y una llegada publicada que conecta esa ruta con el aeropuerto de llegada.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 L10 5.5 L1 10 Z" fill="#38bdf8"/></marker>
    <style>
      .bg{fill:#071426}.panel{fill:#10233d;stroke:#315273;stroke-width:2}.route{fill:none;stroke:#38bdf8;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.route2{fill:none;stroke:#38bdf8;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fbbf24;stroke:#fde68a;stroke-width:3}.label{font-family:Arial,sans-serif;fill:#f8fafc}.small{font-family:Arial,sans-serif;fill:#cbd5e1}.tag{font-family:Arial,sans-serif;font-weight:bold;fill:#071426}.hint{font-family:Arial,sans-serif;fill:#7dd3fc;font-weight:bold;letter-spacing:1px}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="28"/>
  <text class="label" x="600" y="66" text-anchor="middle" font-size="30" font-weight="bold">Estructura conceptual de un vuelo IFR</text>
  <text class="small" x="600" y="99" text-anchor="middle" font-size="18">Las cartas publicadas definen cada procedimiento; este esquema no contiene rutas ni restricciones reales.</text>
  <rect class="panel" x="55" y="180" width="190" height="210" rx="18"/>
  <rect class="panel" x="330" y="180" width="205" height="210" rx="18"/>
  <rect class="panel" x="650" y="180" width="205" height="210" rx="18"/>
  <rect class="panel" x="945" y="180" width="200" height="210" rx="18"/>
  <path class="route2" d="M245 285 H315"/><path class="route2" d="M535 285 H635"/><path class="route" d="M855 285 H930"/>
  <circle class="node" cx="150" cy="245" r="13"/><path d="M110 290 h80 M130 270 v40 M170 270 v40" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <text class="hint" x="150" y="338" text-anchor="middle" font-size="16">ORIGEN</text><text class="label" x="150" y="366" text-anchor="middle" font-size="20" font-weight="bold">Aeropuerto</text>
  <text class="label" x="432" y="244" text-anchor="middle" font-size="26" font-weight="bold">SID</text><text class="small" x="432" y="278" text-anchor="middle" font-size="17">Salida instrumental</text><text class="small" x="432" y="310" text-anchor="middle" font-size="17">publicada</text><text class="small" x="432" y="348" text-anchor="middle" font-size="15">sale del entorno</text>
  <text class="label" x="752" y="244" text-anchor="middle" font-size="24" font-weight="bold">Ruta en ruta</text><text class="small" x="752" y="278" text-anchor="middle" font-size="17">segmento que une</text><text class="small" x="752" y="310" text-anchor="middle" font-size="17">salida y llegada</text><text class="small" x="752" y="348" text-anchor="middle" font-size="15">según el plan</text>
  <text class="label" x="1045" y="244" text-anchor="middle" font-size="26" font-weight="bold">STAR</text><text class="small" x="1045" y="278" text-anchor="middle" font-size="17">Llegada instrumental</text><text class="small" x="1045" y="310" text-anchor="middle" font-size="17">publicada</text><text class="small" x="1045" y="348" text-anchor="middle" font-size="15">lleva al entorno</text>
  <text class="small" x="150" y="448" text-anchor="middle" font-size="17">Pista y salida asignadas</text><text class="small" x="432" y="448" text-anchor="middle" font-size="17">Transición • puntos • notas</text><text class="small" x="752" y="448" text-anchor="middle" font-size="17">Puntos comunes y conexión</text><text class="small" x="1045" y="448" text-anchor="middle" font-size="17">Transición • puntos • notas</text>
  <text class="small" x="600" y="510" text-anchor="middle" font-size="18">Lee siempre el título, la vigencia, las notas y las restricciones en la carta oficial aplicable antes de usarla fuera de esta práctica.</text>
</svg>
