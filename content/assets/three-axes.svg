<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Pitch, roll y yaw</title><desc id="desc">Tres aviones simplificados con flechas que muestran cabeceo, alabeo y guiñada.</desc><style>text{font-family:Arial,sans-serif;fill:#173b35}.t{font-size:31px;font-weight:700}.s{font-size:20px}.plane{fill:#eaf4ef;stroke:#173b35;stroke-width:6}.arrow{fill:none;stroke:#087c74;stroke-width:10;stroke-linecap:round;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8z" fill="#087c74"/></marker></defs><rect width="1200" height="520" fill="#f8fbf9"/><g transform="translate(70 85)"><text class="t" x="0" y="0">PITCH · cabeceo</text><text class="s" x="0" y="34">Nariz arriba / abajo</text><path class="plane" d="M160 150 245 168 160 186 55 168z"/><path class="arrow" d="M120 115Q175 55 230 115"/><text class="s" x="70" y="235">Yoke hacia ti / adelante</text></g><g transform="translate(440 85)"><text class="t" x="0" y="0">ROLL · alabeo</text><text class="s" x="0" y="34">Un ala sube, la otra baja</text><path class="plane" d="M160 105 180 165 330 188 180 195 160 250 140 195 -10 188 140 165z"/><path class="arrow" d="M45 115Q160 270 280 115"/><text class="s" x="45" y="295">Gira el yoke izquierda / derecha</text></g><g transform="translate(825 85)"><text class="t" x="0" y="0">YAW · guiñada</text><text class="s" x="0" y="34">La nariz gira izquierda / derecha</text><path class="plane" d="M160 90 205 260 160 300 115 260z"/><path class="arrow" d="M75 225Q160 330 250 225"/><text class="s" x="60" y="355">Rudder / pedales o gatillos</text></g><text class="s" x="80" y="485">Haz una entrada pequeña, vuelve al centro y observa un solo eje a la vez.</text></svg>
