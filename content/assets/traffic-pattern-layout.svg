<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Circuito de tránsito conceptual de mano izquierda</title>
  <desc id="desc">Vista superior de una pista y cinco tramos: salida, viento cruzado, viento en cola, base y final. Las flechas muestran una trayectoria rectangular de ejemplo, no una carta.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#185a9d"/></marker></defs>
  <rect width="1200" height="720" fill="#eef6fb"/>
  <text x="70" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Circuito de tránsito: relación entre los tramos</text>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="18" fill="#38536a">Ejemplo conceptual desde arriba; la dirección y el lado reales dependen de la pista, el viento y las instrucciones.</text>
  <rect x="485" y="130" width="230" height="500" rx="8" fill="#4f5964"/>
  <line x1="600" y1="150" x2="600" y2="610" stroke="#fff" stroke-width="8" stroke-dasharray="34 22"/>
  <text x="735" y="390" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Pista</text>
  <path d="M640 560 L850 560 L850 210 L350 210 L350 560 L560 560" fill="none" stroke="#185a9d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
  <circle cx="640" cy="560" r="15" fill="#f39c12"/><text x="665" y="568" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Salida</text>
  <text x="862" y="395" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Viento cruzado</text>
  <text x="505" y="190" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Viento en cola</text>
  <text x="105" y="395" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Base</text>
  <text x="400" y="603" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Final</text>
  <rect x="70" y="650" width="1060" height="42" rx="7" fill="#d8e9f7"/>
  <text x="92" y="678" font-family="Arial, sans-serif" font-size="18" fill="#17324d">Idea clave: cada tramo crea una posición desde la que puedes ver, anticipar y preparar el siguiente; no memorices distancias ni alturas de este dibujo.</text>
</svg>
