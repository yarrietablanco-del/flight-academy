<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DME mide distancia inclinada a la estación</title>
  <desc id="desc">Diagrama conceptual lateral que compara la distancia inclinada DME entre un avión y una estación con la distancia horizontal sobre el suelo.</desc>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7c3aed"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#122033}.title{font-size:34px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.muted{fill:#526276}</style>
  </defs>
  <rect width="1200" height="720" fill="#f7fafc"/>
  <text x="600" y="58" text-anchor="middle" class="title">El DME indica distancia inclinada a la estación</text>
  <path d="M96 554 C265 528 420 570 595 548 C775 525 946 565 1110 540 L1110 668 L96 668 Z" fill="#dcfce7"/>
  <path d="M96 554 C265 528 420 570 595 548 C775 525 946 565 1110 540" fill="none" stroke="#4d7c0f" stroke-width="5"/>
  <g transform="translate(300 510)"><rect x="-20" y="-88" width="40" height="88" fill="#0f766e"/><path d="M-45 -88 L0 -150 L45 -88 Z" fill="#14b8a6"/><circle cy="-118" r="13" fill="white"/></g>
  <text x="300" y="594" text-anchor="middle" class="label">Estación DME</text>
  <g transform="translate(865 205)"><path d="M0 -32 L22 26 L0 15 L-22 26 Z" fill="#f97316" stroke="#9a3412" stroke-width="3"/></g>
  <text x="898" y="205" class="label">Avión</text>
  <path d="M330 456 L843 222" stroke="#7c3aed" stroke-width="8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="574" y="305" class="label" fill="#7c3aed">Distancia DME</text>
  <path d="M300 548 L865 548" stroke="#64748b" stroke-width="4" stroke-dasharray="10 9"/>
  <text x="582" y="586" text-anchor="middle" class="body">Distancia horizontal sobre el suelo</text>
  <path d="M865 548 L865 232" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="90" y="630" width="1020" height="52" rx="12" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="600" y="664" text-anchor="middle" class="body">Cerca de la estación y a gran altitud, DME y distancia sobre el suelo pueden diferir.</text>
</svg>
