<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Flujo visual de aproximación, aterrizaje y frustrada del Cessna 172</title>
  <desc id="desc">El avión pasa de viento en cola a base y final con flaps por etapas; la alternativa es una frustrada.</desc>
  <rect width="900" height="470" fill="#f5f8f6"/>
  <text x="45" y="53" font-family="Georgia, serif" font-size="31" fill="#123d3a">C172 · llegar estable a la pista</text>
  <text x="45" y="79" font-family="monospace" font-size="13" fill="#4e716a">flaps por etapas · una decisión clara · frustrada siempre disponible</text>
  <rect x="64" y="303" width="770" height="74" rx="7" fill="#626d6b"/>
  <path d="M90 340h715" stroke="#fff" stroke-width="3" stroke-dasharray="20 17"/>
  <text x="677" y="348" font-family="Arial" font-size="14" fill="#fff">PISTA</text>
  <path d="M145 153H407V238H613" fill="none" stroke="#17645f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M613 238L735 299" fill="none" stroke="#17645f" stroke-width="7" stroke-linecap="round"/>
  <path d="M740 298l-20-2 7 16z" fill="#17645f"/>
  <circle cx="145" cy="153" r="19" fill="#dceee7" stroke="#17645f" stroke-width="3"/><text x="137" y="159" font-family="Arial" font-weight="bold" font-size="15" fill="#17645f">1</text>
  <circle cx="407" cy="153" r="19" fill="#dceee7" stroke="#17645f" stroke-width="3"/><text x="399" y="159" font-family="Arial" font-weight="bold" font-size="15" fill="#17645f">2</text>
  <circle cx="613" cy="238" r="19" fill="#dceee7" stroke="#17645f" stroke-width="3"/><text x="605" y="244" font-family="Arial" font-weight="bold" font-size="15" fill="#17645f">3</text>
  <text x="92" y="122" font-family="Arial" font-size="17" fill="#294944">Viento en cola</text><text x="92" y="178" font-family="Arial" font-size="14" fill="#4a5f5a">1.000 ft AGL · reduce potencia</text>
  <text x="349" y="122" font-family="Arial" font-size="17" fill="#294944">Base</text><text x="349" y="178" font-family="Arial" font-size="14" fill="#4a5f5a">10° bajo 110 KIAS</text>
  <text x="559" y="208" font-family="Arial" font-size="17" fill="#294944">Final</text><text x="559" y="263" font-family="Arial" font-size="14" fill="#4a5f5a">20° / 30° bajo 85 KIAS · ~65 KIAS</text>
  <path d="M660 225C748 153 818 162 827 228" fill="none" stroke="#d68c49" stroke-width="6"/><path d="M830 230l-18-8 3 19z" fill="#d68c49"/>
  <text x="678" y="137" font-family="Georgia, serif" font-size="20" fill="#ae5e2f">¿No estable?</text><text x="678" y="163" font-family="Arial" font-size="15" fill="#ae5e2f">Potencia · actitud · 70–75 KIAS</text>
  <text x="64" y="421" font-family="Arial" font-size="14" fill="#65736f">Aterriza solo si estás alineado, a velocidad aproximada y con pista alcanzable. Si no, aplica frustrada.</text>
</svg>
