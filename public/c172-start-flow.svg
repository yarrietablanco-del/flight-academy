<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" rx="30" fill="#102b2b"/>
  <text x="60" y="66" fill="#e6f5ee" font-family="Arial, sans-serif" font-size="34" font-weight="700">Cessna 172 G1000: flujo de encendido en plataforma</text>
  <text x="60" y="98" fill="#aac9bd" font-family="Arial, sans-serif" font-size="19">Usa el ratón en cabina. Lee una tarjeta, realiza la acción y confirma la señal antes de pasar a la siguiente.</text>
  <g font-family="Arial, sans-serif"><g transform="translate(60 150)"><rect width="250" height="180" rx="18" fill="#1d4543" stroke="#6cb29f"/><circle cx="32" cy="32" r="19" fill="#d7a75e"/><text x="26" y="39" fill="#173938" font-size="18" font-weight="700">1</text><text x="24" y="79" fill="#e6f5ee" font-size="23" font-weight="700">PREPARA</text><text x="24" y="110" fill="#b8d2c8" font-size="17">Freno aplicado</text><text x="24" y="136" fill="#b8d2c8" font-size="17">Combustible: BOTH</text><text x="24" y="162" fill="#b8d2c8" font-size="17">Mezcla: CORTE</text></g><path d="M322 240h55" stroke="#d7a75e" stroke-width="5"/><path d="m365 226 20 14-20 14" fill="none" stroke="#d7a75e" stroke-width="5"/><g transform="translate(405 150)"><rect width="250" height="180" rx="18" fill="#1d4543" stroke="#6cb29f"/><circle cx="32" cy="32" r="19" fill="#d7a75e"/><text x="26" y="39" fill="#173938" font-size="18" font-weight="700">2</text><text x="24" y="79" fill="#e6f5ee" font-size="23" font-weight="700">ENERGÍA</text><text x="24" y="110" fill="#b8d2c8" font-size="17">MASTER: ON</text><text x="24" y="136" fill="#b8d2c8" font-size="17">BEACON: ON</text><text x="24" y="162" fill="#b8d2c8" font-size="17">AVIONICS: OFF</text></g><path d="M667 240h55" stroke="#d7a75e" stroke-width="5"/><path d="m710 226 20 14-20 14" fill="none" stroke="#d7a75e" stroke-width="5"/><g transform="translate(750 150)"><rect width="390" height="180" rx="18" fill="#1d4543" stroke="#6cb29f"/><circle cx="32" cy="32" r="19" fill="#d7a75e"/><text x="26" y="39" fill="#173938" font-size="18" font-weight="700">3</text><text x="24" y="79" fill="#e6f5ee" font-size="23" font-weight="700">CEBA</text><text x="24" y="110" fill="#b8d2c8" font-size="17">Bomba ON → mezcla RICA unos segundos</text><text x="24" y="136" fill="#b8d2c8" font-size="17">Mezcla vuelve a CORTE → bomba OFF</text><text x="24" y="162" fill="#b8d2c8" font-size="17">Mira que el área de hélice esté libre.</text></g><g transform="translate(205 420)"><rect width="330" height="185" rx="18" fill="#e3f1eb"/><circle cx="32" cy="32" r="19" fill="#d7a75e"/><text x="26" y="39" fill="#173938" font-size="18" font-weight="700">4</text><text x="24" y="79" fill="#164c47" font-size="24" font-weight="700">ARRANCA</text><text x="24" y="111" fill="#42615a" font-size="17">Llave: START</text><text x="24" y="137" fill="#42615a" font-size="17">Cuando prende: suelta → BOTH</text><text x="24" y="163" fill="#42615a" font-size="17">Mezcla: RICA</text></g><path d="M547 512h55" stroke="#d7a75e" stroke-width="5"/><path d="m590 498 20 14-20 14" fill="none" stroke="#d7a75e" stroke-width="5"/><g transform="translate(630 420)"><rect width="365" height="185" rx="18" fill="#e3f1eb"/><circle cx="32" cy="32" r="19" fill="#d7a75e"/><text x="26" y="39" fill="#173938" font-size="18" font-weight="700">5</text><text x="24" y="79" fill="#164c47" font-size="24" font-weight="700">CONFIRMA</text><text x="24" y="111" fill="#42615a" font-size="17">Potencia cerca de 1.000 RPM</text><text x="24" y="137" fill="#42615a" font-size="17">Presión de aceite sube</text><text x="24" y="163" fill="#42615a" font-size="17">AVIONICS ON; freno sigue aplicado</text></g></g>
</svg>
