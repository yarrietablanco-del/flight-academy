<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" rx="32" fill="#123b3a"/>
  <text x="55" y="65" fill="#e7f5ef" font-family="Arial, sans-serif" font-size="34" font-weight="700">En el aire: mira fuera, confirma, corrige poco</text>
  <g font-family="Arial, sans-serif"><g transform="translate(55 115)"><rect width="520" height="430" rx="20" fill="#dcefeb"/><path d="M25 250h470" stroke="#6ca698" stroke-width="5"/><path d="M25 245 245 125 495 245" fill="#94cbe4"/><path d="M25 250 245 400 495 250" fill="#83ad68"/><path d="M245 218 195 322h100Z" fill="#fff" stroke="#42645b" stroke-width="4"/><text x="35" y="45" fill="#185a55" font-size="22" font-weight="700">1. REFERENCIA EXTERIOR</text><text x="35" y="82" fill="#41645c" font-size="18">El horizonte te dice si el morro sube,</text><text x="35" y="108" fill="#41645c" font-size="18">baja o las alas están inclinadas.</text></g><g transform="translate(620 115)"><rect width="525" height="125" rx="18" fill="#e4f1eb"/><text x="28" y="43" fill="#185a55" font-size="21" font-weight="700">2. VELOCIDAD</text><text x="28" y="80" fill="#486961" font-size="18">Mírala brevemente; en ascenso inicial busca</text><text x="28" y="106" fill="#486961" font-size="18">aprox. 70–75 nudos, no una cifra perfecta.</text></g><g transform="translate(620 270)"><rect width="525" height="125" rx="18" fill="#e4f1eb"/><text x="28" y="43" fill="#185a55" font-size="21" font-weight="700">3. ALTITUD</text><text x="28" y="80" fill="#486961" font-size="18">Confirma si subes, bajas o mantienes nivel.</text><text x="28" y="106" fill="#486961" font-size="18">Corrige suave y espera a ver el resultado.</text></g><g transform="translate(620 425)"><rect width="525" height="120" rx="18" fill="#fff0d9"/><text x="28" y="43" fill="#765b31" font-size="21" font-weight="700">REGLA DE ORO</text><text x="28" y="80" fill="#765b31" font-size="18">Un cambio cada vez: actitud, potencia o trim.</text><text x="28" y="106" fill="#765b31" font-size="18">Nunca los tres al mismo tiempo.</text></g></g>
</svg>
