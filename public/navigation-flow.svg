<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title">
  <title id="title">Flujo visual de mapa, VOR, GPS y piloto automático</title>
  <rect width="900" height="360" fill="#f5f8f6"/>
  <text x="42" y="51" font-family="Georgia, serif" font-size="30" fill="#123d3a">Navega en este orden</text>
  <text x="42" y="78" font-family="monospace" font-size="13" fill="#4e716a">planifica · confirma · supervisa</text>
  <g font-family="Arial" fill="#294944"><rect x="42" y="115" width="190" height="178" rx="12" fill="#e1f0ea"/><text x="63" y="150" font-size="18">1 · MAPA / EFB</text><text x="63" y="181" font-size="14">SKCL → SKUL</text><text x="63" y="208" font-size="14">rumbo · distancia</text><text x="63" y="235" font-size="14">tiempo · combustible</text><path d="M76 267l45-35 55 15" fill="none" stroke="#17645f" stroke-width="5"/></g>
  <path d="M250 204h45" stroke="#d68c49" stroke-width="5"/><path d="M294 204l-13-8v16z" fill="#d68c49"/>
  <g font-family="Arial" fill="#294944"><rect x="313" y="115" width="250" height="178" rx="12" fill="#fff" stroke="#86b7a8"/><text x="335" y="150" font-size="18">2 · CDI / NAVEGACIÓN</text><circle cx="386" cy="221" r="40" fill="none" stroke="#17645f" stroke-width="4"/><path d="M386 181v80M346 221h80" stroke="#17645f" stroke-width="3"/><text x="448" y="202" font-size="14">VOR: frecuencia</text><text x="448" y="226" font-size="14">TO/FROM · DME</text><text x="448" y="250" font-size="14">GPS: línea magenta</text></g>
  <path d="M580 204h45" stroke="#d68c49" stroke-width="5"/><path d="M624 204l-13-8v16z" fill="#d68c49"/>
  <g font-family="Arial" fill="#294944"><rect x="643" y="115" width="215" height="178" rx="12" fill="#e1f0ea"/><text x="664" y="150" font-size="18">3 · AP SUPERVISADO</text><rect x="664" y="178" width="54" height="28" rx="5" fill="#17645f"/><text x="675" y="198" font-size="13" fill="#fff">HDG</text><rect x="726" y="178" width="48" height="28" rx="5" fill="#17645f"/><text x="738" y="198" font-size="13" fill="#fff">ALT</text><rect x="782" y="178" width="48" height="28" rx="5" fill="#17645f"/><text x="794" y="198" font-size="13" fill="#fff">NAV</text><text x="664" y="239" font-size="14">Confirma PFD</text><text x="664" y="263" font-size="14">Desconecta antes de llegar</text></g>
  <text x="42" y="330" font-family="Arial" font-size="13" fill="#65736f">El GPS y AP ayudan en crucero; el piloto mantiene altura, terreno, combustible y capacidad de desconectar.</text>
</svg>
