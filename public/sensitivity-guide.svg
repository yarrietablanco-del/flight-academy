  <text x="70" y="80" fill="#163c39" font-family="Arial, sans-serif" font-size="34" font-weight="700">Curva inicial: C172 — Training</text>
  <text x="70" y="112" fill="#60746f" font-family="Arial, sans-serif" font-size="20">Una base conservadora para suavizar el centro del yoke. Ajusta solo un eje cada vez.</text>
