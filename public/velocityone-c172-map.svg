<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="32" fill="#102b2b"/>
  <text x="55" y="62" fill="#e8f6f0" font-family="Arial, sans-serif" font-size="33" font-weight="700">Tu VelocityOne: solo los mandos del C172 que necesitas hoy</text>
  <text x="55" y="94" fill="#aac9bd" font-family="Arial, sans-serif" font-size="19">Los nombres entre comillas son los que debes buscar en MSFS 2024.</text>
  <g font-family="Arial, sans-serif"><g transform="translate(55 140)"><rect width="630" height="405" rx="24" fill="#193f3d" stroke="#75b7a6" stroke-width="2"/><text x="28" y="38" fill="#d8ad67" font-size="18" font-weight="700">1 · UNIDAD YOKE</text><path d="M315 125c-98 0-150 55-150 105v68h300v-68c0-50-52-105-150-105Z" fill="#0c2626" stroke="#cae7db" stroke-width="7"/><rect x="281" y="285" width="68" height="78" rx="10" fill="#0c2626" stroke="#cae7db" stroke-width="6"/><path d="M165 225h300M315 125v175" stroke="#d8ad67" stroke-dasharray="7 7" stroke-width="3"/><circle cx="206" cy="217" r="16" fill="#d8ad67"/><text x="31" y="128" fill="#e6f5ee" font-size="21" font-weight="700">Gira el yoke</text><text x="31" y="154" fill="#b6d1c7" font-size="17">→ “Aileron Axis”</text><text x="31" y="181" fill="#b6d1c7" font-size="17">inclina las alas.</text><circle cx="468" cy="217" r="16" fill="#d8ad67"/><text x="470" y="128" fill="#e6f5ee" font-size="21" font-weight="700">Empuja / tira</text><text x="470" y="154" fill="#b6d1c7" font-size="17">→ “Elevator Axis”</text><text x="470" y="181" fill="#b6d1c7" font-size="17">baja / sube el morro.</text><rect x="96" y="320" width="78" height="38" rx="12" fill="#d8ad67"/><text x="65" y="387" fill="#e6f5ee" font-size="18" font-weight="700">LT: timón izq.</text><text x="65" y="413" fill="#b6d1c7" font-size="16">“Rudder Axis”</text><rect x="456" y="320" width="78" height="38" rx="12" fill="#d8ad67"/><text x="425" y="387" fill="#e6f5ee" font-size="18" font-weight="700">RT: timón der.</text><text x="425" y="413" fill="#b6d1c7" font-size="16">“Rudder Axis”</text></g>
  <g transform="translate(720 140)"><rect width="425" height="405" rx="24" fill="#193f3d" stroke="#75b7a6" stroke-width="2"/><text x="28" y="38" fill="#d8ad67" font-size="18" font-weight="700">2 · THROTTLE QUADRANT</text><circle cx="92" cy="124" r="55" fill="#0c2626" stroke="#cae7db" stroke-width="7"/><path d="M92 70v30" stroke="#d8ad67" stroke-width="8"/><text x="165" y="109" fill="#e6f5ee" font-size="21" font-weight="700">Rueda TRIM</text><text x="165" y="135" fill="#b6d1c7" font-size="17">Ajuste fino: no la uses</text><text x="165" y="159" fill="#b6d1c7" font-size="17">hasta volar recto y nivelado.</text><path d="M85 300v-94M185 300v-94M285 300v-94" stroke-width="18" stroke-linecap="round"/><path d="M85 300v-94" stroke="#222"/><path d="M185 300v-94" stroke="#3d88b9"/><path d="M285 300v-94" stroke="#c7554a"/><text x="47" y="335" fill="#e6f5ee" font-size="18" font-weight="700">NEGRA</text><text x="37" y="360" fill="#b6d1c7" font-size="16">Throttle</text><text x="147" y="335" fill="#e6f5ee" font-size="18" font-weight="700">AZUL</text><text x="137" y="360" fill="#b6d1c7" font-size="16">Propeller</text><text x="243" y="335" fill="#e6f5ee" font-size="18" font-weight="700">ROJA</text><text x="238" y="360" fill="#b6d1c7" font-size="16">Mixture</text></g>
  <g transform="translate(55 580)"><rect width="1090" height="125" rx="20" fill="#e2f1eb"/><text x="28" y="38" fill="#165a55" font-size="21" font-weight="700">3 · BOTONES QUE SÍ USARÁS AL PRINCIPIO</text><text x="28" y="72" fill="#314f49" font-size="19">B2 (mango derecho): frenos · HAT derecho arriba/abajo: flaps menos/más · HAT derecho izquierda: freno de estacionamiento.</text><text x="28" y="103" fill="#314f49" font-size="19">No asignes nada más hasta que estos mandos funcionen. Los botones B3–B12 pueden esperar.</text></g></g>
</svg>
