  <g font-family="Arial, sans-serif"><rect x="470" y="110" width="260" height="455" rx="10" fill="#596566"/><path d="M600 125v425" stroke="#f9f7df" stroke-width="5" stroke-dasharray="28 18"/><text x="536" y="165" fill="#fff" font-size="24" font-weight="700">PISTA</text><path d="M735 505h260V195H790" fill="none" stroke="#167169" stroke-width="9"/><path d="m790 195-28 18 28 18M995 505l-18-28-18 28" fill="none" stroke="#167169" stroke-width="8"/><path d="M465 195H210v310h255" fill="none" stroke="#167169" stroke-width="9"/><path d="m465 195-28 18 28 18M210 505l18-28 18 28" fill="none" stroke="#167169" stroke-width="8"/><g fill="#d8ad67"><circle cx="750" cy="505" r="23"/><circle cx="995" cy="195" r="23"/><circle cx="465" cy="195" r="23"/><circle cx="210" cy="505" r="23"/></g><g fill="#173f3b" font-size="18" font-weight="700"><text x="740" y="512">1</text><text x="985" y="202">2</text><text x="455" y="202">3</text><text x="200" y="512">4</text></g><text x="770" y="540" fill="#355750" font-size="18">SALIDA</text><text x="845" y="175" fill="#355750" font-size="18">VIENTO CRUZADO</text><text x="245" y="175" fill="#355750" font-size="18">VIENTO EN COLA</text><text x="250" y="540" fill="#355750" font-size="18">BASE → FINAL</text><text x="55" y="605" fill="#5a706a" font-size="19">Si la aproximación no está estable, da potencia, asciende y vuelve a intentarlo. No fuerces el aterrizaje.</text></g>
